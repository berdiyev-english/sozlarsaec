<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Bewords 2048</title>
<style>
  :root {
    --gap: 12px;
    --radius: 6px;
    --board-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --page-bg: #faf8ef;      /* Светлый бежевый фон */
    --text-main: #776e65;    /* Темный текст */
    --text-inv: #f9f6f2;     /* Светлый текст (на кнопках) */
    --anim: 100ms;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-reduced-motion: reduce) { :root { --anim: 0ms; } }
  
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  
  body {
    margin: 0; 
    background: var(--page-bg);
    color: var(--text-main);
    font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    display: grid; 
    place-items: center; 
    padding: 20px 10px; /* Чуть больше отступ, чтобы не прилипало к краям экрана */
    user-select: none; 
    -webkit-user-select: none;
    overflow-x: hidden;
  }

  .wrap { 
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 20px; 
  }

  /* ВЕРХНЯЯ ПАНЕЛЬ */
  .topbar { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
  }
  
  .brand { 
    font-size: 36px; 
    font-weight: 800; 
    color: var(--text-main);
    line-height: 1;
  }
  
  .scores { 
    display: flex; 
    gap: 6px; 
  }
  
  .badge {
    background: #bbada0;
    padding: 6px 14px; 
    border-radius: 6px; 
    text-align: center; 
    min-width: 70px;
  }
  .badge span { 
    display: block; 
    text-transform: uppercase; 
    font-size: 11px; 
    line-height: 13px; 
    color: #eee4da; 
    font-weight: 700;
  }
  .badge b { 
    display: block; 
    color: #fff; 
    font-size: 20px; 
    font-weight: 700; 
    margin-top: 2px; 
  }

  .controls { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
  }
  
  button, select {
    background: #8f7a66; 
    color: #fff; 
    border: none;
    border-radius: 6px; 
    padding: 10px 16px; 
    font-weight: 700; 
    font-size: 16px;
    cursor: pointer; 
    outline: none;
    appearance: none;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: #9f8b77; }
  button:active { transform: translateY(2px); }

  /* ИГРОВОЕ ПОЛЕ */
  .board {
    position: relative; 
    width: 100%; 
    aspect-ratio: 1/1;
    background: var(--board-bg); 
    border-radius: var(--radius);
    /* Добавляем бордюр того же цвета, чтобы избежать субпиксельных "разрывов" по краям */
    border: 4px solid var(--board-bg); 
    touch-action: none;
  }

  /* Сетка и тайлы лежат друг над другом */
  .grid-container, .tile-container {
    position: absolute;
    inset: 0;
    padding: var(--gap); /* Отступы внутри рамки */
    display: grid;
    grid-template-columns: repeat(var(--size), 1fr);
    grid-template-rows: repeat(var(--size), 1fr);
    gap: var(--gap);
  }
  
  .grid-container { z-index: 1; }
  .tile-container { z-index: 2; pointer-events: none; }

  .cell { 
    background: var(--cell-bg); 
    border-radius: 4px; 
    width: 100%; 
    height: 100%; 
  }

  /* Тайлы */
  .tile {
    position: absolute; /* Позиционируем JS-ом точно */
    width: var(--w); height: var(--h);
    background: #eee4da;
    border-radius: 4px;
    display: flex; 
    justify-content: center; 
    align-items: center;
    font-weight: 700; 
    font-size: 30px;
    line-height: 1;
    z-index: 10;
    transform: translate3d(var(--tx), var(--ty), 0) scale(var(--s, 1));
    transition: transform var(--anim) var(--ease);
    will-change: transform;
  }

  .tile.new { animation: pop 200ms ease; }
  .tile.merged { animation: pop 200ms ease; z-index: 20; }
  
  @keyframes pop {
    0% { transform: translate3d(var(--tx), var(--ty), 0) scale(0.5); }
    50% { transform: translate3d(var(--tx), var(--ty), 0) scale(1.1); }
    100% { transform: translate3d(var(--tx), var(--ty), 0) scale(1); }
  }

  /* ЦВЕТА ТАЙЛОВ */
  .tile[data-val="2"]    { background: #eee4da; color: #776e65; }
  .tile[data-val="4"]    { background: #ede0c8; color: #776e65; }
  .tile[data-val="8"]    { background: #f2b179; color: #f9f6f2; }
  .tile[data-val="16"]   { background: #f59563; color: #f9f6f2; }
  .tile[data-val="32"]   { background: #f67c5f; color: #f9f6f2; }
  .tile[data-val="64"]   { background: #f65e3b; color: #f9f6f2; }
  .tile[data-val="128"]  { background: #edcf72; color: #f9f6f2; font-size: 2.5em; }
  .tile[data-val="256"]  { background: #edcc61; color: #f9f6f2; font-size: 2.5em; }
  .tile[data-val="512"]  { background: #edc850; color: #f9f6f2; font-size: 2.5em; }
  .tile[data-val="1024"] { background: #edc53f; color: #f9f6f2; font-size: 2.0em; }
  .tile[data-val="2048"] { background: #edc22e; color: #f9f6f2; font-size: 2.0em; }

  /* ОВЕРЛЕИ (Меню, Победа, Поражение) */
  .overlay {
    position: absolute; inset: 0; z-index: 100;
    background: rgba(250, 248, 239, 0.8); /* Светлый полупрозрачный фон */
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: var(--radius);
    animation: fadein 0.3s;
  }
  .overlay.show { display: flex; }
  
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* Специфика Стартового Меню */
  #startScreen {
    background: #faf8ef; /* Непрозрачный фон для старта */
    z-index: 200;
  }
  #startScreen h1 {
    font-size: 42px;
    color: #776e65;
    margin: 0 0 10px;
  }
  #startScreen p {
    font-size: 18px;
    color: #776e65;
    margin: 0 0 30px;
    opacity: 0.8;
  }
  .big-btn {
    background: #8f7a66;
    color: #f9f6f2;
    font-size: 24px;
    padding: 15px 40px;
    border-radius: 6px;
    box-shadow: 0 4px 0 #7f6a56;
    transition: transform 0.1s;
  }
  .big-btn:active {
    transform: translateY(4px);
    box-shadow: none;
  }

  .overlay-text { font-size: 40px; font-weight: 800; color: #776e65; margin-bottom: 20px; }
  .overlay-btns { display: flex; gap: 10px; }

  .hint { text-align: center; font-size: 14px; color: #776e65; opacity: 0.6; margin-top: 10px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">2048</div>
    <div class="scores">
      <div class="badge"><span>SCORE</span><b id="score">0</b></div>
      <div class="badge"><span>BEST</span><b id="best">0</b></div>
    </div>
  </div>

  <div class="controls">
    <div style="display:flex; gap:10px;">
      <button id="newGameBtn">New Game</button>
      <button id="undoBtn">Undo</button>
    </div>
    <select id="sizeSel">
      <option value="3">3 x 3</option>
      <option value="4" selected>4 x 4</option>
      <option value="5">5 x 5</option>
      <option value="6">6 x 6</option>
    </select>
  </div>

  <div class="board" id="board" style="--size:4">
    <!-- Сетка (пустые ячейки) -->
    <div class="grid-container" id="grid"></div>
    <!-- Тайлы (двигаются поверх) -->
    <div class="tile-container" id="tiles"></div>

    <!-- СТАРТОВОЕ МЕНЮ -->
    <div class="overlay show" id="startScreen">
      <h1>Bewords 2048</h1>
      <p>Join the numbers to get to 2048!</p>
      <button class="big-btn" id="playBtn">Play</button>
    </div>

    <!-- ПОБЕДА -->
    <div class="overlay" id="winOv">
      <div class="overlay-text">You Win! 🎉</div>
      <div class="overlay-btns">
        <button id="contBtn">Keep going</button>
        <button id="retryWinBtn">Try again</button>
      </div>
    </div>

    <!-- ПОРАЖЕНИЕ -->
    <div class="overlay" id="loseOv">
      <div class="overlay-text">Game Over!</div>
      <button id="retryLoseBtn">Try again</button>
    </div>
  </div>

  <div class="hint">
    Свайпай пальцем или используй стрелки/WASD
  </div>
</div>

<script>
(() => {
  // --- State ---
  const D = document;
  const els = {
    board: D.getElementById('board'),
    grid:  D.getElementById('grid'),
    tiles: D.getElementById('tiles'),
    score: D.getElementById('score'),
    best:  D.getElementById('best'),
    start: D.getElementById('startScreen'),
    win:   D.getElementById('winOv'),
    lose:  D.getElementById('loseOv')
  };

  let config = {
    size: 4,
    best: parseInt(localStorage.getItem('bewords-2048-best') || '0')
  };
  
  let state = {
    tiles: [],   // {id, x, y, val}
    score: 0,
    history: [], // для undo
    isPlaying: false,
    won: false,
    over: false,
    lock: false
  };

  let idSeq = 1;

  els.best.textContent = config.best;

  // --- Core Logic ---

  function init() {
    // Размер доски
    els.board.style.setProperty('--size', config.size);
    
    // Генерация сетки
    els.grid.innerHTML = '';
    for(let i=0; i<config.size*config.size; i++) {
      const cell = D.createElement('div');
      cell.className = 'cell';
      els.grid.appendChild(cell);
    }
  }

  function startGame() {
    state = {
      tiles: [],
      score: 0,
      history: [],
      isPlaying: true,
      won: false,
      over: false,
      lock: false
    };
    els.score.textContent = '0';
    els.tiles.innerHTML = '';
    els.win.classList.remove('show');
    els.lose.classList.remove('show');
    els.start.classList.remove('show');
    
    addRandomTile();
    addRandomTile();
    saveState();
    render();
  }

  // Точный расчет координат, чтобы не было "подрезаний"
  function getPos(x, y) {
    // Мы используем координаты ячейки сетки как эталон
    const index = y * config.size + x;
    const cell = els.grid.children[index];
    
    // Вычисляем позицию относительно контейнера тайлов
    // Это компенсирует padding родителя автоматически
    return {
      x: cell.offsetLeft,
      y: cell.offsetTop,
      w: cell.offsetWidth,
      h: cell.offsetHeight
    };
  }

  function render() {
    // Проходим по существующим DOM тайлам
    const domTiles = Array.from(els.tiles.children);
    const activeIds = new Set(state.tiles.map(t => String(t.id)));

    // Удаляем те, которых нет в state
    domTiles.forEach(el => {
      if(!activeIds.has(el.dataset.id)) el.remove();
    });

    // Обновляем или создаем
    state.tiles.forEach(t => {
      let el = els.tiles.querySelector(`.tile[data-id="${t.id}"]`);
      const pos = getPos(t.x, t.y);
      const isNew = !el;

      if(isNew) {
        el = D.createElement('div');
        el.className = `tile new`;
        el.dataset.id = t.id;
        els.tiles.appendChild(el);
      } else {
        el.classList.remove('new', 'merged');
        if(t.merged) {
           // хак для перезапуска анимации слияния
           void el.offsetWidth; 
           el.classList.add('merged');
           t.merged = false; // сброс флага
        }
      }

      // Применяем стили
      el.dataset.val = t.val;
      el.textContent = t.val;
      el.style.setProperty('--tx', pos.x + 'px');
      el.style.setProperty('--ty', pos.y + 'px');
      el.style.setProperty('--w', pos.w + 'px');
      el.style.setProperty('--h', pos.h + 'px');
      
      // Адаптивный шрифт для больших чисел
      if(t.val > 100 && t.val < 1000) el.style.fontSize = (pos.w * 0.4) + 'px';
      else if(t.val >= 1000) el.style.fontSize = (pos.w * 0.35) + 'px';
      else el.style.fontSize = (pos.w * 0.5) + 'px';
    });
  }

  // --- Game Mechanics ---

  function addRandomTile() {
    const empty = [];
    for(let x=0; x<config.size; x++) {
      for(let y=0; y<config.size; y++) {
        if(!state.tiles.find(t => t.x===x && t.y===y)) empty.push({x,y});
      }
    }
    if(empty.length === 0) return;
    const cell = empty[Math.floor(Math.random()*empty.length)];
    state.tiles.push({
      id: idSeq++,
      x: cell.x,
      y: cell.y,
      val: Math.random() > 0.9 ? 4 : 2
    });
  }

  function saveState() {
    // Глубокая копия для undo
    state.history.push({
      tiles: JSON.parse(JSON.stringify(state.tiles)),
      score: state.score
    });
    if(state.history.length > 10) state.history.shift();
  }

  function undo() {
    if(!state.isPlaying || state.history.length <= 1) return;
    state.history.pop(); // Текущее состояние
    const prev = state.history[state.history.length - 1];
    state.tiles = JSON.parse(JSON.stringify(prev.tiles));
    state.score = prev.score;
    els.score.textContent = state.score;
    state.over = false;
    state.won = false;
    els.lose.classList.remove('show');
    els.win.classList.remove('show');
    render();
  }

  function move(dir) {
    if(!state.isPlaying || state.lock || state.over) return;
    
    const vec = {
      ArrowUp:    {x:0, y:-1},
      ArrowDown:  {x:0, y:1},
      ArrowLeft:  {x:-1,y:0},
      ArrowRight: {x:1, y:0}
    }[dir];
    
    if(!vec) return;

    state.lock = true;
    let moved = false;
    
    // Сортировка порядка обработки (чтобы не перепрыгивали)
    let sorted = [...state.tiles];
    if(vec.x===1) sorted.sort((a,b) => b.x - a.x);
    else if(vec.x===-1) sorted.sort((a,b) => a.x - b.x);
    else if(vec.y===1) sorted.sort((a,b) => b.y - a.y);
    else if(vec.y===-1) sorted.sort((a,b) => a.y - b.y);

    // Карта занятости для слияний в этот ход
    const mergedIds = new Set();

    sorted.forEach(t => {
      let cx = t.x, cy = t.y;
      let dist = 0;
      
      while(true) {
        const nx = cx + vec.x;
        const ny = cy + vec.y;
        
        if(nx<0 || nx>=config.size || ny<0 || ny>=config.size) break;
        
        const blocker = state.tiles.find(o => o.x===nx && o.y===ny);
        
        if(!blocker) {
          // Пусто - двигаем
          cx = nx; cy = ny;
          moved = true;
        } else if(blocker.val === t.val && !mergedIds.has(blocker.id) && !mergedIds.has(t.id)) {
          // Слияние
          state.tiles = state.tiles.filter(o => o.id !== t.id); // Удаляем старый
          blocker.val *= 2;
          blocker.merged = true;
          mergedIds.add(blocker.id); // Этот тайл больше нельзя сливать в этот ход
          state.score += blocker.val;
          els.score.textContent = state.score;
          if(state.score > config.best) {
            config.best = state.score;
            els.best.textContent = config.best;
            localStorage.setItem('bewords-2048-best', config.best);
          }
          if(blocker.val === 2048 && !state.won) {
             state.won = true;
             setTimeout(() => els.win.classList.add('show'), 200);
          }
          moved = true;
          // Анимация "прилета" старого тайла в новый
          // Создаем фантом для анимации, но это сложно, упростим:
          // просто визуально текущий исчезает, а целевой "бампается"
          break; 
        } else {
          break;
        }
      }
      t.x = cx; t.y = cy;
    });

    if(moved) {
      render();
      setTimeout(() => {
        addRandomTile();
        saveState();
        render();
        checkOver();
        state.lock = false;
      }, 150); // Чуть больше времени анимации
    } else {
      state.lock = false;
    }
  }

  function checkOver() {
    // Если есть пустые клетки - играем
    if(state.tiles.length < config.size*config.size) return;
    
    // Проверка соседних
    for(let t of state.tiles) {
      for(let d of [[0,1],[0,-1],[1,0],[-1,0]]) {
        const n = state.tiles.find(o => o.x===t.x+d[0] && o.y===t.y+d[1]);
        if(n && n.val === t.val) return; // Есть ход
      }
    }
    state.over = true;
    els.lose.classList.add('show');
  }

  // --- Input Handling ---
  
  // Keyboard
  window.addEventListener('keydown', e => {
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
      e.preventDefault();
      move(e.code);
    }
    if(e.code === 'KeyW') move('ArrowUp');
    if(e.code === 'KeyS') move('ArrowDown');
    if(e.code === 'KeyA') move('ArrowLeft');
    if(e.code === 'KeyD') move('ArrowRight');
  });

  // Touch
  let ts = {x:0, y:0};
  els.board.addEventListener('touchstart', e => {
    ts.x = e.touches[0].clientX;
    ts.y = e.touches[0].clientY;
  }, {passive: false});
  
  els.board.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - ts.x;
    const dy = e.changedTouches[0].clientY - ts.y;
    if(Math.abs(dx) > 30 || Math.abs(dy) > 30) {
      if(Math.abs(dx) > Math.abs(dy)) move(dx>0 ? 'ArrowRight' : 'ArrowLeft');
      else move(dy>0 ? 'ArrowDown' : 'ArrowUp');
    }
  }, {passive: false});

  // Prevent scroll on board
  els.board.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

  // --- Buttons ---
  D.getElementById('playBtn').onclick = startGame;
  D.getElementById('newGameBtn').onclick = startGame;
  D.getElementById('retryWinBtn').onclick = startGame;
  D.getElementById('retryLoseBtn').onclick = startGame;
  D.getElementById('contBtn').onclick = () => els.win.classList.remove('show');
  D.getElementById('undoBtn').onclick = undo;
  
  D.getElementById('sizeSel').onchange = (e) => {
    config.size = parseInt(e.target.value);
    init();
    // После смены размера сразу показываем меню или рестарт
    els.start.classList.add('show');
    state.isPlaying = false;
  };

  // Ресайз окна (пересчет позиций)
  window.addEventListener('resize', () => {
     // Небольшая задержка чтобы layout устаканился
     setTimeout(render, 100);
  });

  // Init
  init();

})();
</script>
</body>
</html>
