<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Озвучка слов (Google TTS)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            margin-top: 0;
            font-size: 24px;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        select {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🔊 Озвучка слов</h1>
        
        <input type="text" id="wordInput" placeholder="Введите слово на английском..." autocomplete="off">
        
        <div>
            <select id="accentSelect">
                <option value="en-US">Американский акцент (US)</option>
                <option value="en-GB">Британский акцент (UK)</option>
            </select>
        </div>

        <button onclick="speakWord()">Озвучить</button>
        <p id="errorText" class="error">Пожалуйста, введите текст!</p>
    </div>

    <script>
        function speakWord() {
            // Получаем текст из инпута
            const text = document.getElementById('wordInput').value.trim();
            const errorText = document.getElementById('errorText');
            
            // Если пусто - показываем ошибку
            if (!text) {
                errorText.style.display = 'block';
                return;
            }
            
            errorText.style.display = 'none';

            // Получаем выбранный акцент
            const lang = document.getElementById('accentSelect').value;

            // Кодируем текст (чтобы пробелы и спецсимволы не сломали ссылку)
            const encodedText = encodeURIComponent(text);

            // Формируем секретную ссылку на API Google Переводчика
            // client=tw-ob - это важный параметр, без него Гугл заблокирует запрос
            const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${lang}&q=${encodedText}`;

            // Создаем аудио объект и воспроизводим его
            const audio = new Audio(googleTtsUrl);
            audio.play().catch(error => {
                alert("Ошибка воспроизведения. Возможно, нет подключения к интернету.");
            });
        }

        // Озвучка по нажатию клавиши Enter
        document.getElementById('wordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                speakWord();
            }
        });
    </script>

</body>
</html>
