<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- МАГИЧЕСКАЯ СТРОКА: Прячет адрес твоего сайта от Гугла, чтобы избежать блокировки (403 Forbidden) -->
    <meta name="referrer" content="no-referrer">
    
    <title>Озвучка слов (Google TTS)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            margin-top: 0;
            font-size: 24px;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        select {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            width: 95%;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🔊 Озвучка слов</h1>
        
        <input type="text" id="wordInput" placeholder="Введите слово или фразу..." autocomplete="off">
        
        <div>
            <select id="accentSelect">
                <option value="en-US">🇺🇸 Американский акцент</option>
                <option value="en-GB">🇬🇧 Британский акцент</option>
                <option value="ru-RU">🇷🇺 Русский (если нужно)</option>
            </select>
        </div>

        <button id="playBtn" onclick="speakWord()">Озвучить</button>
        <p id="errorText" class="error"></p>
    </div>

    <script>
        function speakWord() {
            const input = document.getElementById('wordInput');
            const btn = document.getElementById('playBtn');
            const errorText = document.getElementById('errorText');
            
            const text = input.value.trim();
            
            if (!text) {
                showError('Пожалуйста, введите текст!');
                return;
            }
            
            errorText.style.display = 'none';
            btn.disabled = true;
            btn.innerText = 'Загрузка...';

            const lang = document.getElementById('accentSelect').value;
            const encodedText = encodeURIComponent(text);

            // client=tw-ob - имитация веб-приложения Гугла
            const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${lang}&q=${encodedText}`;

            const audio = new Audio(googleTtsUrl);
            
            // Когда аудио начинает играть, возвращаем кнопку в норму
            audio.onplay = () => {
                btn.disabled = false;
                btn.innerText = 'Озвучить';
            };

            // Обработка ошибок (например, пропал интернет)
            audio.onerror = () => {
                btn.disabled = false;
                btn.innerText = 'Озвучить';
                showError('Ошибка загрузки. Проверьте интернет или попробуйте позже.');
            };

            // Запускаем аудио
            audio.play().catch(e => {
                btn.disabled = false;
                btn.innerText = 'Озвучить';
                showError('Браузер заблокировал автовоспроизведение.');
            });
        }

        function showError(msg) {
            const errorText = document.getElementById('errorText');
            errorText.innerText = msg;
            errorText.style.display = 'block';
        }

        // Озвучка по Enter
        document.getElementById('wordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                speakWord();
            }
        });
    </script>

</body>
</html>
