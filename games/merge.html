<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bewords Merge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Убираем скролл страницы */
            background-color: #FFF8E1;
            font-family: 'Fredoka', sans-serif;
        }

        /* Основной слой */
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh; /* Высота на весь экран */
            width: 100vw;
        }

        /* --- 1. ШАПКА BEWORDS (Закреплена сверху) --- */
        header {
            flex: 0 0 auto; /* Не сжимается */
            height: 70px;   /* Фиксированная высота */
            background: #FFFFFF;
            border-bottom: 4px solid #FFE0B2;
            display: flex;
            justify-content: center; /* Центрируем лого */
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            z-index: 10;
            position: relative;
        }

        .logo-container {
            text-align: center;
            line-height: 1;
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            color: #E65100;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .brand span {
            color: #FF9800;
        }

        .sub-brand {
            font-size: 10px;
            color: #FB8C00;
            letter-spacing: 4px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* Декор в шапке (фрукты по бокам) */
        .header-decor {
            position: absolute;
            font-size: 24px;
            top: 50%;
            transform: translateY(-50%);
        }
        .decor-left { left: 20px; }
        .decor-right { right: 20px; }

        /* --- 2. КОНТЕЙНЕР ДЛЯ ИГРЫ --- */
        main {
            flex: 1 1 auto; /* Занимает всё оставшееся место */
            position: relative;
            background-color: #FFF3E0;
            /* Паттерн фона (для десктопа видно по бокам) */
            background-image: radial-gradient(#FFCC80 15%, transparent 16%);
            background-size: 20px 20px;
            
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Прижимаем к верху или center */
        }

        /* Рамка для игры (iframe) */
        .game-frame-wrapper {
            width: 100%;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Адаптация для больших экранов (чтобы игра не была растянута) */
        @media (min-width: 600px) {
            .game-frame-wrapper {
                max-width: 450px; /* Ширина мобильника */
                height: 100%;     /* Высота на всю доступную область */
                border-left: 2px solid #FFE0B2;
                border-right: 2px solid #FFE0B2;
            }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Заглушка загрузки */
        .loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFF;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #E65100;
            z-index: 1;
            pointer-events: none;
            animation: fadeOut 0.5s ease 2s forwards; /* Исчезнет через 2 сек */
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

    </style>
</head>
<body>

<div class="app-layout">
    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header>
        <div class="header-decor decor-left">🍒</div>
        
        <div class="logo-container">
            <div class="brand">Bewords <span>Merge</span></div>
            <div class="sub-brand">FRUIT GAME</div>
        </div>
        
        <div class="header-decor decor-right">🍉</div>
    </header>

    <!-- ОБЛАСТЬ ИГРЫ -->
    <main>
        <div class="game-frame-wrapper">
            <!-- Загрузка -->
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>&nbsp; Loading...
            </div>

            <!-- Вставка игры -->
            <iframe 
                src="https://llerrah.com/games/fruitmerge/index.html" 
                scrolling="no" 
                allowfullscreen>
            </iframe>
        </div>
    </main>
</div>

</body>
</html>
