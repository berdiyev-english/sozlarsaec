<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BEWORDS TILE</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="../styles.css">
    <!-- Font Awesome (локальный) -->
    <link rel="stylesheet" href="../fonts/fontawesome/css/all.min.css">

    <style>
        :root {
            --bg-color: #4facfe;
            --tile-w: clamp(46px, 12vw, 58px);
            --tile-h: clamp(54px, 14vw, 66px);
            --dock-height: 90px;
            --dock-scale: 0.82;
            --accent-shadow: #2d3436;
        }

        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none;
            outline: none; 
        }

        html {
            touch-action: manipulation;
            -ms-touch-action: manipulation;
            overflow: hidden;
            background: #4facfe;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #74b9ff;
            background-image: radial-gradient(#dfe6e9 20%, transparent 20%);
            background-size: 20px 20px;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            touch-action: none;
        }

        /* иконки FA в кнопках */
        button i, .modal-link i, .label i, p i, .premium-subtitle i { margin-right: 8px; }
        .btn-icon i { margin: 0; }
        i[data-fallback] { font-style: normal; }

        /* ========== MENU ========== */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #54a0ff;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.2) 20%, transparent 20%),
                radial-gradient(circle, rgba(255,255,255,0.2) 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease-in-out, transform 0.5s;
        }
        #start-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.1); }

        .premium-title {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: clamp(3.5rem, 12vw, 5rem);
            color: #ffeaa7;
            line-height: 0.9;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
            -webkit-text-stroke: 3px var(--accent-shadow); 
            text-shadow: 5px 5px 0px var(--accent-shadow);
            transform: rotate(-3deg);
        }
        
        .premium-subtitle {
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 34px;
            font-weight: 600;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            background: #ff7675;
            padding: 5px 15px;
            border-radius: 20px;
            transform: rotate(2deg);
            box-shadow: 3px 3px 0 var(--accent-shadow);
            border: 2px solid var(--accent-shadow);
        }

        /* декоративные фрукты на меню */
        .menu-fruits {
            display: flex; gap: 10px; margin-bottom: 26px;
            filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.18));
        }
        .menu-fruits svg {
            width: clamp(38px, 11vw, 52px); height: clamp(38px, 11vw, 52px);
            animation: floaty 3s ease-in-out infinite;
        }
        .menu-fruits svg:nth-child(2) { animation-delay: .4s; }
        .menu-fruits svg:nth-child(3) { animation-delay: .8s; }
        .menu-fruits svg:nth-child(4) { animation-delay: 1.2s; }
        .menu-fruits svg:nth-child(5) { animation-delay: 1.6s; }
        @keyframes floaty {
            0%,100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-9px) rotate(5deg); }
        }

        .stats-box {
            background: #fff;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 28px;
            text-align: center;
            border: 4px solid var(--accent-shadow);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 320px;
        }
        .stats-box .label {
            font-family: 'Nunito', sans-serif;
            font-size: 0.8rem;
            color: #636e72;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .stats-box .label i { color: #0984e3; }
        .stats-box .value {
            font-family: 'Nunito', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark, #2d3436);
        }
        .stats-row { display: flex; justify-content: space-around; width: 100%; }
        .stats-row > div { flex: 1; }

        .btn-premium {
            background: #00b894;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 15px 40px;
            border: 4px solid var(--accent-shadow);
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 6px 6px 0px var(--accent-shadow);
            transition: all 0.1s;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        .btn-premium:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--accent-shadow); }

        .btn-secondary {
            background: #fab1a0;
            color: var(--accent-shadow);
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 30px;
            border: 3px solid var(--accent-shadow);
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 5px 5px 0px var(--accent-shadow);
            width: 70%;
            max-width: 250px;
            margin-top: 5px;
        }
        .btn-secondary:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0px var(--accent-shadow); }

        /* ========== UI ========== */
        .header-row {
            width: 100%; max-width: 450px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 15px 0;
            z-index: 10;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .btn-icon {
            background: #fff; color: #333;
            width: 42px; height: 42px;
            border-radius: 10px; font-size: 1.15rem;
            border: 2px solid #333; box-shadow: 3px 3px 0 #333;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s; touch-action: manipulation;
        }
        .btn-icon:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #333; }

        .game-logo {
            font-family: 'Nunito', sans-serif; font-size: 1.8rem; 
            color: #fff; font-weight: 700;
            -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333;
        }

        .ui-bar {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-between;
            padding: 5px 20px;
            color: #333; font-weight: 700; font-size: 1.1rem;
            z-index: 10;
        }
        #score-display, #level-display {
            background: #fff; padding: 4px 12px; border-radius: 20px;
            border: 2px solid #333; box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 7px; font-size: 1rem;
        }
        #level-display i { color: #6c5ce7; }
        #score-display i { color: #fdcb6e; -webkit-text-stroke: 1px #e0a800; }

        /* ========== BOARD ========== */
        #game-board {
            position: relative;
            width: 95%; max-width: 360px;
            flex-grow: 1; margin: 8px auto;
            touch-action: none;
        }

        .tile {
            width: var(--tile-w); height: var(--tile-h);
            background: linear-gradient(180deg, #ffffff 45%, var(--tint, #ffffff) 100%);
            border-radius: 12px;
            position: absolute;
            display: flex; justify-content: center; align-items: center;
            font-size: clamp(22px, 7vw, 30px);
            cursor: pointer;
            border: 3px solid #333;
            box-shadow: 3px 3px 0 #999;
            /* Время анимации должно быть чуть меньше времени лока в JS (300ms vs 350ms) */
            transition: left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                        top 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                        transform 0.2s ease, opacity 0.2s ease;
            z-index: 10;
            transform-origin: center center;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            overflow: hidden;
        }
        /* блик сверху плитки */
        .tile::after {
            content: ''; position: absolute; left: 0; top: 0; right: 0; height: 45%;
            background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,0));
            pointer-events: none;
        }
        .tile .art {
            width: 82%; height: 82%; display: block; position: relative; z-index: 2;
            filter: drop-shadow(1px 2px 1px rgba(0,0,0,.22));
            pointer-events: none;
        }

        /* мягкая подсветка плитки под каждый фрукт */
        .tile[data-f="strawberry"] { --tint:#ffe1e5; }
        .tile[data-f="lemon"]      { --tint:#fff6d6; }
        .tile[data-f="grapes"]     { --tint:#efe2ff; }
        .tile[data-f="watermelon"] { --tint:#ffe3e3; }
        .tile[data-f="kiwi"]       { --tint:#eafbd9; }
        .tile[data-f="pineapple"]  { --tint:#fff1cf; }
        .tile[data-f="cherry"]     { --tint:#ffdde1; }
        .tile[data-f="peach"]      { --tint:#ffeade; }
        .tile[data-f="coconut"]    { --tint:#f2e6dc; }
        .tile[data-f="avocado"]    { --tint:#e6f5d8; }
        .tile[data-f="apple"]      { --tint:#e7f8d5; }
        .tile[data-f="orange"]     { --tint:#ffe9d1; }

        .tile.disabled {
            filter: brightness(0.78) saturate(0.55) grayscale(0.35); cursor: default;
        }
        /* понятная «вуаль» на заблокированной плитке */
        .tile.disabled::after {
            background: linear-gradient(180deg, rgba(45,52,54,.32), rgba(45,52,54,.18));
        }
        .tile.disabled .art { opacity: .85; }

        .tile:not(.disabled):not(.in-dock):active {
            transform: scale(0.92); box-shadow: 1px 1px 0 #999;
        }

        .tile.in-dock {
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            border: 2px solid #333; background: #fff;
            transform: rotate(0deg) scale(var(--dock-scale)) !important;
        }
        .tile.in-dock::after { display: none; }

        /* ========== DOCK ========== */
        .dock-container {
            background: #fff;
            border-radius: 20px;
            border: 3px solid #333; border-bottom: 6px solid #333;
            width: 96%; max-width: 400px; height: var(--dock-height);
            display: flex; justify-content: center; align-items: center;
            gap: 3px;
            margin-bottom: max(12px, env(safe-area-inset-bottom));
            position: relative; z-index: 5;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 0 8px;
        }

        .dock-slot {
            width: calc(var(--tile-w) * var(--dock-scale)); 
            height: calc(var(--tile-h) * var(--dock-scale)); 
            border-radius: 10px;
            background: #dfe6e9;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        /* ========== ЧАСТИЦЫ ВЗРЫВА ========== */
        .burst-p {
            position: absolute; width: 9px; height: 9px; border-radius: 50%;
            margin: -4.5px 0 0 -4.5px; pointer-events: none; z-index: 1500;
            animation: burstOut .55s cubic-bezier(.15,.7,.3,1) forwards;
        }
        @keyframes burstOut {
            0%   { transform: translate(0,0) scale(1.1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(.15); opacity: 0; }
        }
        .burst-ring {
            position: absolute; border-radius: 50%; pointer-events: none; z-index: 1499;
            border: 3px solid rgba(255,255,255,.9); width: 14px; height: 14px;
            margin: -7px 0 0 -7px; animation: ringOut .45s ease-out forwards;
        }
        @keyframes ringOut {
            0%   { transform: scale(.4); opacity: .95; }
            100% { transform: scale(5.5); opacity: 0; }
        }

        /* ========== MODALS ========== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0);
            display: flex; justify-content: center; align-items: center;
            z-index: 300; opacity: 0; pointer-events: none; 
            transition: all 0.5s; overflow: hidden;
            /* резервируем место НАД карточкой под кубок со звёздами,
               чтобы на маленьких экранах корона не обрезалась сверху */
            padding: max(96px, calc(env(safe-area-inset-top, 0px) + 80px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); }

        .confetti-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .confetti {
            position: absolute; width: 11px; height: 11px; top: -20px;
            animation: confetti-fall 3s linear forwards;
        }
        .confetti.c-star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .confetti.c-ring { background: transparent !important; border: 3px solid currentColor; border-radius: 50%; }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        .rays {
            position: absolute; width: 300%; height: 300%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 255, 255, 0.2) 10deg, transparent 20deg, transparent 30deg, rgba(255, 255, 255, 0.2) 40deg, transparent 50deg, transparent 60deg, rgba(255, 255, 255, 0.2) 70deg, transparent 80deg, transparent 90deg);
            animation: rotate-rays 20s linear infinite; opacity: 0; transition: opacity 1s;
        }
        .modal-overlay.active.win .rays { opacity: 1; }
        @keyframes rotate-rays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .modal-card {
            background: #fff; width: 90%; max-width: 340px; padding: 0;
            border-radius: 25px; text-align: center;
            border: 4px solid #333; box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
            transform: scale(0) rotate(-10deg);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: visible;
        }
        .modal-overlay.active .modal-card { transform: scale(1) rotate(0deg); }

        .crown {
            position: absolute; bottom: calc(100% - 18px); left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            z-index: 10; pointer-events: none;
        }
        .trophy {
            width: 84px; height: 84px; display: block;
            filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.25));
            animation: trophy-bounce 0.6s ease-out 0.3s both;
        }
        @keyframes trophy-bounce {
            0% { transform: scale(0) rotate(-20deg); } 50% { transform: scale(1.3) rotate(5deg); }
            70% { transform: scale(0.9) rotate(-3deg); } 100% { transform: scale(1) rotate(0deg); }
        }

        .stars-container {
            display: flex; gap: 6px; justify-content: center;
        }
        .star {
            font-size: 2.1rem; color: #ffeaa7; -webkit-text-stroke: 2px #333;
            opacity: 0; transform: scale(0) rotate(-180deg);
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.2));
        }
        .star:nth-child(1) { animation: star-pop 0.5s ease-out 0.6s forwards; }
        .star:nth-child(2) { animation: star-pop 0.5s ease-out 0.8s forwards; font-size: 2.6rem; margin-top: -15px; }
        .star:nth-child(3) { animation: star-pop 0.5s ease-out 1s forwards; }
        @keyframes star-pop {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.4) rotate(20deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .modal-content { padding: 60px 30px 30px; }
        .ribbon {
            background: #fdcb6e; color: #333; font-family: 'Nunito', sans-serif; font-weight: 800;
            font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase;
            padding: 10px 40px; position: relative; margin: 0 -30px 20px;
            border-top: 3px solid #333; border-bottom: 3px solid #333; box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .ribbon i { margin-right: 8px; }
        .win-title {
            font-family: 'Nunito', sans-serif; font-size: 2.8rem; font-weight: 800; color: #00b894;
            -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 #333;
            margin: 10px 0; animation: title-pulse 2s ease-in-out infinite;
        }
        @keyframes title-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        .level-complete { font-family: 'Nunito', sans-serif; font-size: 1.1rem; color: #636e72; margin-bottom: 20px; font-weight: 600; }
        .level-complete span { color: #2d3436; font-weight: 800; font-size: 1.4rem; }

        .stats-row-modal {
            display: flex; justify-content: center; gap: 20px; margin: 25px 0; padding: 15px;
            background: #f1f2f6; border-radius: 15px; border: 2px solid #b2bec3;
        }
        .stat-item { text-align: center; }
        .stat-value { font-family: 'Nunito', sans-serif; font-size: 1.8rem; font-weight: 800; color: #333; display: block; }
        .stat-value.animated { animation: count-up 0.5s ease-out forwards; }
        .stat-label { font-size: 0.7rem; color: #636e72; text-transform: uppercase; margin-top: 5px; font-weight: 700; }
        .stat-label i { margin-right: 5px; color: #b2bec3; }

        .btn-next-level {
            background: #0984e3; color: white; font-family: 'Nunito', sans-serif; font-size: 1.2rem; font-weight: 700;
            padding: 18px 40px; border: 3px solid #333; border-radius: 15px; cursor: pointer; text-transform: uppercase; 
            box-shadow: 5px 5px 0 #333; transition: all 0.1s; position: relative; overflow: hidden; width: 100%; margin-top: 10px;
        }
        .btn-next-level:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #333; }
        .btn-next-level .arrow { display: inline-block; margin-left: 10px; margin-right: 0; animation: arrow-bounce 1s ease-in-out infinite; }
        @keyframes arrow-bounce { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }

        .modal-link {
            color: #b2bec3; cursor: pointer; font-size: 0.9rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 20px; display: inline-block; transition: color 0.2s;
        }
        .modal-link:active { color: #636e72; }

        .lose-emoji {
            font-size: 3.6rem; animation: shake-emoji 0.5s ease-in-out; display: block; margin-bottom: 10px;
            color: #ff7675; -webkit-text-stroke: 2px #333; filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.2));
        }
        @keyframes shake-emoji {
            0%,100% { transform: rotate(0); } 20% { transform: rotate(-12deg); }
            40% { transform: rotate(10deg); } 60% { transform: rotate(-7deg); } 80% { transform: rotate(5deg); }
        }
        .lose-title { font-family: 'Nunito', sans-serif; font-size: 2.2rem; color: #d63031; margin: 10px 0; -webkit-text-stroke: 1.5px #333; text-shadow: 2px 2px 0 #333; font-weight: 800; }
        .btn-retry {
            background: #d63031; color: white; font-family: 'Nunito', sans-serif; font-size: 1.2rem; font-weight: 700;
            padding: 18px 40px; border: 3px solid #333; border-radius: 15px; cursor: pointer; text-transform: uppercase;
            box-shadow: 5px 5px 0 #333; width: 100%; margin-top: 20px;
        }
        .btn-retry:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #333; }

        @keyframes popScale { 0% { transform: scale(0) rotate(0deg); } 100% { transform: scale(1) rotate(var(--rot, 0deg)); } }
        @keyframes matchAnim { 0% { transform: scale(var(--dock-scale)); opacity: 1; background: #ffeaa7; } 50% { transform: scale(1.15); } 100% { transform: scale(0); opacity: 0; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s ease; }
        @keyframes count-up { from { opacity: .3; } to { opacity: 1; } }

        .save-indicator {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem;
            opacity: 0; transition: opacity 0.3s; z-index: 500; pointer-events: none; border: 2px solid #fff;
            font-weight: 700;
        }
        .save-indicator.show { opacity: 1; }
        .save-indicator i { margin-right: 6px; }

        /* ========== АДАПТИВ: НИЗКИЕ ЭКРАНЫ (SE и ниже) ==========
           Блок НАМЕРЕННО стоит в конце каскада, чтобы перебивать базовые стили модалки. */
        @media (max-height: 740px) {
            .modal-overlay { padding-top: max(78px, env(safe-area-inset-top, 0px)); }
            .trophy { width: 64px; height: 64px; }
            .star { font-size: 1.7rem; }
            .star:nth-child(2) { font-size: 2.1rem; margin-top: -10px; }
            .modal-content { padding: 48px 22px 22px; }
            .ribbon { padding: 8px 30px; margin-bottom: 12px; }
            .win-title { font-size: 2.2rem; margin: 6px 0; }
            .level-complete { margin-bottom: 12px; font-size: 1rem; }
            .stats-row-modal { margin: 14px 0; padding: 10px; gap: 14px; }
            .stat-value { font-size: 1.5rem; }
            .btn-next-level, .btn-retry { padding: 14px 30px; font-size: 1.05rem; margin-top: 8px; }

            .lose-emoji { font-size: 2.9rem; }
        }

            .lose-emoji { font-size: 2.4rem; margin-bottom: 4px; }
            .lose-title { font-size: 1.8rem; margin: 6px 0; }
        }

            <svg viewBox="0 0 64 64"><use href="#fruit-cherry"/></svg>
        </div>

        <div class="stats-box">
            <div class="stats-row">
                <div>
                    <div class="label"><i class="fa-solid fa-layer-group" data-fallback="🎚"></i>Уровень</div>

                    <div class="label"><i class="fa-solid fa-trophy" data-fallback="🏆"></i>Рекорд</div>

        <button class="btn-premium" id="btn-continue"><i class="fa-solid fa-play" data-fallback="▶"></i>ПРОДОЛЖИТЬ</button>
        <button class="btn-secondary" id="btn-new-game"><i class="fa-solid fa-bolt" data-fallback="⚡"></i>Новая игра</button>
    </div>

    <!-- GAME UI -->
    <div class="header-row">
        <button class="btn-icon" id="btn-home" aria-label="В меню"><i class="fa-solid fa-house" data-fallback="🏠"></i></button>
        <div class="game-logo">BEWORDS</div>
        <button class="btn-icon" id="btn-restart" aria-label="Заново"><i class="fa-solid fa-arrows-rotate" data-fallback="↺"></i></button>
    </div>
    <div class="ui-bar">
        <div id="level-display"><i class="fa-solid fa-layer-group" data-fallback="▤"></i><span id="level-text">Lv. 1</span></div>
        <div id="score-display"><i class="fa-solid fa-star" data-fallback="★"></i><span id="score-text">0</span></div>
    </div>
    <div id="game-board"></div>
    <div class="dock-container" id="dock"></div>

    <!-- MODALS -->
    <div id="gameModal" class="modal-overlay">
        <div class="confetti-container" id="confettiContainer"></div>
        <div class="rays"></div>
        <div class="modal-card">
            <!-- WIN -->
            <div id="win-content" style="display: none;">
                <div class="crown">
                    <svg class="trophy" viewBox="0 0 64 64"><use href="#ico-trophy"/></svg>
                    <div class="stars-container">
                        <i class="fa-solid fa-star star" data-fallback="★"></i>
                        <i class="fa-solid fa-star star" data-fallback="★"></i>
                        <i class="fa-solid fa-star star" data-fallback="★"></i>
                    </div>
                </div>
                <div class="modal-content">
                    <div class="ribbon"><i class="fa-solid fa-ribbon" data-fallback="🎀"></i>УРОВЕНЬ ПРОЙДЕН</div>
                    <div class="win-title">ПОБЕДА!</div>
                    <div class="level-complete">Уровень <span id="completed-level">1</span></div>
                    <div class="stats-row-modal">
                        <div class="stat-item">
                            <span class="stat-value" id="modal-score">0</span>
                            <div class="stat-label"><i class="fa-solid fa-star" data-fallback="★"></i>Очки</div>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="modal-best">0</span>
                            <div class="stat-label"><i class="fa-solid fa-trophy" data-fallback="🏆"></i>Рекорд</div>
                        </div>
                    </div>
                    <button class="btn-next-level" id="btn-next">УРОВЕНЬ <span id="next-level-num">2</span><i class="fa-solid fa-angles-right arrow" data-fallback="→"></i></button>
                    <div class="modal-link" id="m-menu-win"><i class="fa-solid fa-house" data-fallback="🏠"></i>В Меню</div>
                </div>
            </div>
            <!-- LOSE -->
            <div id="lose-content" style="display: none;">
                <div class="modal-content" style="padding-top: 30px;">
                    <span class="lose-emoji"><i class="fa-solid fa-face-frown" data-fallback="😢"></i></span>
                    <div class="lose-title">Не вышло...</div>
                    <p style="color: #636e72; margin: 15px 0; font-weight: 600;">
                        <i class="fa-solid fa-box-open" data-fallback="📦"></i>Док переполнен!
                    </p>
                    <button class="btn-retry" id="btn-retry"><i class="fa-solid fa-rotate-right" data-fallback="🔄"></i>Ещё раз</button>
                    <div class="modal-link" id="m-menu-lose"><i class="fa-solid fa-house" data-fallback="🏠"></i>В Меню</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DOCK_SIZE = 7;
        // Теперь это id SVG-символов из спрайта (а не эмодзи)
        const ALL_FRUITS = ['strawberry', 'lemon', 'grapes', 'watermelon', 'kiwi', 'pineapple',
                            'cherry', 'peach', 'coconut', 'avocado', 'apple', 'orange'];
        // цвета для частиц взрыва
        const FRUIT_COLORS = {
            strawberry:'#e63950', lemon:'#f4c025', grapes:'#8e5ce0', watermelon:'#ff5c6c',
            kiwi:'#9ccc3c', pineapple:'#ffab2e', cherry:'#d81e3c', peach:'#ff9470',
            coconut:'#8d6e63', avocado:'#a5d64a', apple:'#8bc34a', orange:'#ff9b26'
        };
        const STORAGE_KEY = 'bewords_tile_save_v4'; // Уникальный ключ для сохранения
        const MIN_TILE_DISTANCE = 20;
        const MAX_TILES = 60; 
        const MAX_TRIPLES = MAX_TILES / 3; 

        // ============ ЗВУКОВЫЕ ФАЙЛЫ ============
        // tap  — плашка встала на место в док (+ тапы по кнопкам)
        // pop  — «взрыв» собранной тройки
        const SFX_FILES = {
            tap: '../au/ui/tap.mp3',
            pop: '../au/ui/pop.mp3'
        };
        const SFX_VOLUME = { tap: 0.85, pop: 0.95 };
        const SFX_POOL = 5;           // сколько копий аудио держать (чтобы звуки не «захлёбывались»)

        // ============ STATE ============
        let currentLevel = 1;
        let score = 0;
        let bestScore = 0;
        let tiles = [];
        let dock = [];
        let isLocked = false;
        let levelFinished = false;
        let sfxReady = false;
        const sfx = {};               // name -> {pool:[], idx:0, ok:bool}

        // ============ AUDIO: ТОЛЬКО MP3 ============
        function initSfx() {
            Object.keys(SFX_FILES).forEach(name => {
                if (sfx[name]) return;
                const pool = [];
                let ok = true;
                for (let i = 0; i < SFX_POOL; i++) {
                    const a = new Audio(SFX_FILES[name]);
                    a.preload = 'auto';
                    a.volume = SFX_VOLUME[name] || 1;
                    a.addEventListener('error', () => { ok = false; if (sfx[name]) sfx[name].ok = false; });
                    pool.push(a);
                }
                sfx[name] = { pool, idx: 0, ok };
            });
            sfxReady = true;
        }
        // Разблокировка аудио на первом касании (требование iOS/Android)
        function unlockAudio() {
            initSfx();
            initAudio();
            Object.keys(sfx).forEach(name => {
                const a = sfx[name].pool[0];
                if (a.dataset.unlocked) return;
                a.dataset.unlocked = '1';
                a.muted = true;                      // тихий «прогон» для разблокировки
                const p = a.play();
                if (p && p.catch) p.catch(() => {});
                a.addEventListener('ended', () => { a.muted = false; }, { once: true });
                setTimeout(() => { a.muted = false; }, 800);
            });
        }
        function playFile(name, volume, rate) {
            const s = sfx[name];
            if (!s || !s.ok) return false;
            const a = s.pool[s.idx++ % s.pool.length];
            try {
                a.muted = false;
                a.volume = (volume !== undefined ? volume : SFX_VOLUME[name]) || 1;
                if (rate) a.playbackRate = rate;
                a.currentTime = 0;
                const p = a.play();
                if (p && p.catch) p.catch(() => { s.ok = false; });
                return true;
            } catch (e) { s.ok = false; return false; }
        }

        // ============ AUDIO: ТОЧКА ВХОДА ============
        // Все звуки — только из mp3-файлов (tap.mp3 / pop.mp3), без WebAudio-синтеза.
        // Мелодии собираются изменением playbackRate у тех же файлов.
        function playSound(type) {
            if (!sfxReady) initSfx();
            switch (type) {
                case 'click':  // взяли плитку с поля
                    playFile('tap', 0.5, 1.12);
                    break;
                case 'dock':   // плашка встала на место
                    playFile('tap', 0.85, 0.97 + Math.random()*0.06);
                    break;
                case 'ui':     // тап по кнопке меню
                    playFile('tap', 0.6, 1.05);
                    break;
                case 'match':  // взрыв тройки
                    playFile('pop', 0.95);
                    break;
                case 'error':  // док полон / нельзя
                    playFile('tap', 0.7, 0.55);
                    setTimeout(() => playFile('tap', 0.6, 0.5), 90);
                    break;
                case 'win':    // фанфары финального экрана — синтезированные, как изначально
                    winJingle();
                    break;
            }
        }

        // ============ ФАНФАРЫ ФИНАЛЬНОГО ЭКРАНА ============
        // Единственный синтезированный звук, оставленный сознательно (по просьбе игрока):
        // победная мелодия модалки. Mp3-файла под неё нет, а терять её не хотелось.
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        function winJingle() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const notes = [523, 659, 783, 1046, 783, 1046];
            notes.forEach((f, i) => {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = i < 4 ? 'square' : 'sine'; o.frequency.value = f;
                g.gain.setValueAtTime(0.06, now + i*0.12); g.gain.linearRampToValueAtTime(0, now + i*0.12 + 0.3);
                o.connect(g); g.connect(audioCtx.destination); o.start(now + i*0.12); o.stop(now + i*0.12 + 0.3);
            });
        }

        // ============ SVG-АРТ ============
        function fruitSVG(id) {
            return `<svg class="art" viewBox="0 0 64 64" aria-hidden="true"><use href="#fruit-${id}"/></svg>`;
        }

        // ============ VISUALS ============
        function createConfetti() {
            const c = document.getElementById('confettiContainer'); c.innerHTML = '';
            const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#A29BFE', '#55EFC4'];
            const shapes = ['', 'c-star', 'c-ring'];
            for (let i=0; i<60; i++) {
                const el = document.createElement('div');
                const shape = shapes[Math.floor(Math.random()*shapes.length)];
                const col = colors[Math.floor(Math.random()*colors.length)];
                el.className = 'confetti' + (shape ? ' ' + shape : '');
                el.style.left = Math.random()*100+'%';
                el.style.background = col;
                if (shape === 'c-ring') el.style.color = col;
                const s = Math.random()*9+7;
                el.style.width = s+'px'; el.style.height = s+'px';
                if (!shape) el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
                el.style.animationDelay = Math.random()*2+'s';
                el.style.animationDuration = (Math.random()*2+2)+'s';
                c.appendChild(el);
            }
        }

        // «Взрыв» частиц на месте собранной тройки
        function spawnBurst(el, color) {
            const board = document.getElementById('game-board');
            const bRect = board.getBoundingClientRect();
            const r = el.getBoundingClientRect();
            if (!r.width) return;
            const x = r.left + r.width/2 - bRect.left;
            const y = r.top + r.height/2 - bRect.top;

            const ring = document.createElement('div');
            ring.className = 'burst-ring';
            ring.style.left = x+'px'; ring.style.top = y+'px';
            ring.style.borderColor = color;
            board.appendChild(ring);
            setTimeout(() => ring.remove(), 500);

            const n = 16;
            for (let i=0; i<n; i++) {
                const p = document.createElement('div');
                p.className = 'burst-p';
                const ang = (Math.PI*2*i)/n + Math.random()*0.5;
                const dist = 34 + Math.random()*60;
                p.style.left = x+'px'; p.style.top = y+'px';
                p.style.background = Math.random() > .35 ? color : '#ffffff';
                const sz = 7 + Math.random()*8;
                p.style.width = sz+'px'; p.style.height = sz+'px';
                p.style.setProperty('--dx', (Math.cos(ang)*dist).toFixed(1)+'px');
                p.style.setProperty('--dy', (Math.sin(ang)*dist - 12).toFixed(1)+'px');
                p.style.animationDuration = (0.4 + Math.random()*0.3)+'s';
                board.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        // Фолбэк иконок, если Font Awesome не загрузился
        function applyIconFallbacks() {
            let ok = false;
            try {
                ok = !!(document.fonts && document.fonts.check &&
                        (document.fonts.check('900 16px "Font Awesome 6 Free"') ||
                         document.fonts.check('400 16px "Font Awesome 6 Free"')));
            } catch (e) { ok = false; }
            if (ok) return;
            document.querySelectorAll('i[data-fallback]').forEach(i => {
                i.classList.remove('fa-solid','fa-regular','fa-brands');
                i.className = i.className.replace(/\bfa-[a-z0-9-]+\b/g, '').trim();
                i.textContent = i.getAttribute('data-fallback');
            });
        }

        // ============ SAVE SYSTEM ============
        function saveProgress() {
            try {
                const data = { level: currentLevel, score: score, bestScore: Math.max(score, bestScore), timestamp: Date.now() };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                const ind = document.getElementById('saveIndicator');
                ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 1500);
            } catch(e){}
        }
        function loadProgress() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    currentLevel = data.level||1; score = data.score||0; bestScore = data.bestScore||0;
                    return true;
                }
            } catch(e){} return false;
        }
        function updateMenuStats() {
            loadProgress();
            document.getElementById('menu-level').textContent = currentLevel;
            document.getElementById('menu-best').textContent = bestScore;
        }

        // ============ NAVIGATION ============
        function showStartScreen() {
            updateMenuStats();
            document.getElementById('start-screen').classList.remove('hidden');
            closeModal();
            document.getElementById('game-board').innerHTML = '';
            document.getElementById('dock').innerHTML = '';
            tiles = []; dock = [];
        }
        function startGame(isNew) {
            unlockAudio();
            playSound('ui');
            if (isNew) { currentLevel = 1; score = 0; saveProgress(); } else { loadProgress(); }
            document.getElementById('start-screen').classList.add('hidden');
            loadLevel();
        }
        function goHome() { playSound('ui'); saveProgress(); showStartScreen(); }
        function nextLevel() { playSound('ui'); closeModal(); loadLevel(); }
        function restartLevel() { playSound('ui'); closeModal(); score = Math.max(0, score - 50); saveProgress(); loadLevel(); }
        function closeModal() {
            document.getElementById('gameModal').classList.remove('active', 'win', 'lose');
            document.getElementById('confettiContainer').innerHTML = '';
        }

        // ============ LEVEL GEN ============
        function loadLevel() {
            isLocked = false; levelFinished = false; dock = []; tiles = [];
            document.getElementById('level-text').textContent = `Lv. ${currentLevel}`;
            document.getElementById('score-text').textContent = score;
            
            const board = document.getElementById('game-board'); board.innerHTML = '';
            const dockEl = document.getElementById('dock'); dockEl.innerHTML = '';
            for(let i=0; i<DOCK_SIZE; i++) {
                const d = document.createElement('div'); d.className = 'dock-slot'; dockEl.appendChild(d);
            }
            
            const typesCount = Math.min(ALL_FRUITS.length, 3 + Math.floor(currentLevel/2));
            let calculatedTriples = 5 + (currentLevel * 2); 
            const triplesCount = Math.min(calculatedTriples, MAX_TRIPLES);
            
            let deck = [];
            const lvlFruits = [...ALL_FRUITS].sort(()=>0.5-Math.random()).slice(0, typesCount);
            for(let i=0; i<triplesCount; i++) {
                const f = lvlFruits[i % typesCount]; deck.push(f,f,f);
            }
            deck.sort(()=>0.5-Math.random());
            
            const rect = board.getBoundingClientRect();
            const maxX = rect.width - 60; const maxY = rect.height - 70;
            // сетка раскладки подстраивается под высоту экрана (чтобы поле не пустовало)
            const GRID_X = 56, GRID_Y = 62;
            const rows = Math.max(5, Math.floor((rect.height - 60) / GRID_Y));
            const cols = Math.max(4, Math.floor((rect.width - 20) / GRID_X));
            const placed = [];
            let id = 0;
            
            deck.forEach((fruit, idx) => {
                const el = document.createElement('div');
                el.className = 'tile';
                el.dataset.f = fruit;
                el.innerHTML = fruitSVG(fruit);
                let x, y, attempts=0;
                do {
                    let r = Math.floor(Math.random()*rows); let c = Math.floor(Math.random()*cols);
                    if (idx > deck.length*0.5) { r = 1 + Math.floor(Math.random()*Math.max(1, rows-2)); c = 1 + Math.floor(Math.random()*Math.max(1, cols-2)); }
                    x = (c*GRID_X) + (Math.random()*20-10) + 8; y = (r*GRID_Y) + (Math.random()*20-10) + 14;
                    x = Math.max(5, Math.min(x, maxX)); y = Math.max(5, Math.min(y, maxY));
                    attempts++;
                } while(isTooClose(x,y,placed) && attempts<100);
                
                placed.push({x,y});
                const rot = (Math.random()*10)-5;
                el.style.setProperty('--rot', `${rot}deg`);
                el.style.transform = `rotate(${rot}deg)`;
                el.style.left = x+'px'; el.style.top = y+'px'; el.style.zIndex = idx;
                el.style.animation = `popScale 0.35s backwards ${idx*0.015}s`;
                
                const tObj = { id: id++, el, fruit, x, y, w: el.offsetWidth, h: el.offsetHeight, z: idx, inDock: false };
                const action = (e) => { e.preventDefault(); clickTile(tObj); };
                el.addEventListener('click', action); el.addEventListener('touchstart', action, {passive:false});
                board.appendChild(el); tiles.push(tObj);
            });
            updateClickability();
        }

        function isTooClose(x, y, arr) {
            for(let p of arr) { if (Math.abs(p.x-x) < MIN_TILE_DISTANCE && Math.abs(p.y-y) < MIN_TILE_DISTANCE) return true; }
            return false;
        }

        // Плитка заблокирована ТОЛЬКО если её центр физически прикрыт плиткой выше.
        // То есть «куда можно тапнуть — то и кликается»: никаких фантомных блокировок,
        // когда плитка выглядит свободной, но не нажимается.
        function updateClickability() {
            tiles.forEach(t => {
                if(t.inDock) return;
                const cx = t.x + t.w/2, cy = t.y + t.h/2;
                let covered = false;
                for (const o of tiles) {
                    if (o === t || o.inDock || o.z <= t.z) continue;
                    if (cx > o.x + 3 && cx < o.x + o.w - 3 && cy > o.y + 3 && cy < o.y + o.h - 3) { covered = true; break; }
                }
                t.el.classList.toggle('disabled', covered);
            });
        }

        // ============ GAME LOGIC ============
        function clickTile(t) {
            if(isLocked || t.el.classList.contains('disabled') || t.inDock) return;
            if(dock.length >= DOCK_SIZE) {
                playSound('error'); t.el.classList.add('shake');
                setTimeout(()=>t.el.classList.remove('shake'),300); return;
            }
            
            // Блокируем ввод на время анимации (350мс)
            isLocked = true; 
            playSound('click');
            
            t.inDock = true;
            t.el.classList.add('in-dock');
            
            // Поднимаем плитку вверх, чтобы она летела поверх дока
            t.el.style.zIndex = 2000;
            
            // Более надежный поиск позиции
            let insIdx = dock.length;
            // Ищем последний такой же фрукт
            let foundIndex = -1;
            for(let i = 0; i < dock.length; i++) {
                if(dock[i].fruit === t.fruit) foundIndex = i;
            }
            if(foundIndex !== -1) insIdx = foundIndex + 1;
            
            dock.splice(insIdx, 0, t);
            // ЗВУК: плашка встала на место
            playSound('dock');
            
            requestAnimationFrame(() => {
                renderDock();
                updateClickability();
                setTimeout(() => {
                    // Разблокируем только когда анимация прошла
                    renderDock();          // довставляем плашки точно в слоты после анимации
                    updateClickability();
                    isLocked = false;
                    checkMatches();
                }, 350);
            });
        }

        function renderDock() {
            const bRect = document.getElementById('game-board').getBoundingClientRect();
            const slots = document.querySelectorAll('.dock-slot');
            
            dock.forEach((t, i) => {
                if(i >= slots.length || !t.el.isConnected) return;
                const sRect = slots[i].getBoundingClientRect();
                const tx = (sRect.left + sRect.width/2) - bRect.left - t.el.offsetWidth/2;
                const ty = (sRect.top + sRect.height/2) - bRect.top - t.el.offsetHeight/2;
                
                t.el.style.left = `${tx}px`;
                t.el.style.top = `${ty}px`;
                // Восстанавливаем нормальный z-index после полета
                t.el.style.zIndex = 1000 + i;
            });
        }

        function checkMatches() {
            for(let i=0; i<dock.length-2; i++) {
                if(dock[i].fruit === dock[i+1].fruit && dock[i].fruit === dock[i+2].fruit) {
                    isLocked = true;
                    const triplet = [dock[i], dock[i+1], dock[i+2]];
                    const color = FRUIT_COLORS[triplet[0].fruit] || '#ffcc00';

                    // ЗВУК: взрыв
                    playSound('match');
                    // визуальный взрыв
                    triplet.forEach((t, k) => setTimeout(() => spawnBurst(t.el, color), k*60));

                    score += 50;
                    bestScore = Math.max(score, bestScore);
                    document.getElementById('score-text').textContent = score;
                    
                    triplet.forEach(t => t.el.style.animation = 'matchAnim 0.35s forwards');
                    
                    setTimeout(() => {
                        triplet.forEach(t => t.el.remove());
                        dock.splice(i, 3);
                        renderDock();
                        isLocked = false;
                        settleState();
                        // контрольная «доза» после анимаций: позиции дока и состояние
                        setTimeout(() => { renderDock(); updateClickability(); settleState(); }, 330);
                    }, 350);
                    return;
                }
            }
            settleState();
        }

        // Страховка от «залипания»: проверяем цепные тройки, победу и поражение
        // каждый раз, когда док пришёл в покой. Игра больше не может застрять.
        function settleState() {
            if (levelFinished) return;
            for (let i=0; i<dock.length-2; i++) {
                if (dock[i].fruit === dock[i+1].fruit && dock[i].fruit === dock[i+2].fruit) {
                    if (!isLocked) {
                        isLocked = true;
                        setTimeout(() => { isLocked = false; checkMatches(); }, 60);
                    }
                    return;
                }
            }
            const rem = tiles.filter(t => !t.inDock).length;
            if (rem === 0 && dock.length === 0) {
                levelFinished = true;
                playSound('win');
                currentLevel++;
                saveProgress();
                showWinModal(currentLevel - 1);
            } else if (dock.length >= DOCK_SIZE) {
                levelFinished = true;
                playSound('error');
                showLoseModal();
            }
        }

        function showWinModal(completedLvl) {
            const m = document.getElementById('gameModal');
            document.getElementById('win-content').style.display = 'block';
            document.getElementById('lose-content').style.display = 'none';
            document.getElementById('completed-level').textContent = completedLvl;
            document.getElementById('next-level-num').textContent = currentLevel;
            document.getElementById('modal-score').textContent = score;
            document.getElementById('modal-best').textContent = bestScore;
            createConfetti();
            m.classList.add('active', 'win');
            setTimeout(() => {
                document.getElementById('modal-score').classList.add('animated');
                document.getElementById('modal-best').classList.add('animated');
            }, 800);
        }
        function showLoseModal() {
            const m = document.getElementById('gameModal');
            document.getElementById('win-content').style.display = 'none';
            document.getElementById('lose-content').style.display = 'block';
            m.classList.add('active', 'lose');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSfx();
            // первичная разблокировка звука по любому касанию/клику
            ['pointerdown','touchstart','click'].forEach(ev =>
                window.addEventListener(ev, unlockAudio, { once: true, passive: true }));

            document.getElementById('btn-continue').addEventListener('click', () => startGame(false));
            document.getElementById('btn-new-game').addEventListener('click', () => startGame(true));
            document.getElementById('btn-home').addEventListener('click', goHome);
            document.getElementById('btn-restart').addEventListener('click', restartLevel);
            document.getElementById('btn-next').addEventListener('click', nextLevel);
            document.getElementById('btn-retry').addEventListener('click', restartLevel);
            document.getElementById('m-menu-win').addEventListener('click', goHome);
            document.getElementById('m-menu-lose').addEventListener('click', goHome);
            
            updateMenuStats();
            document.addEventListener('touchmove', (e) => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
            window.addEventListener('resize', () => { if(dock.length>0) setTimeout(renderDock, 100); });
            document.addEventListener('visibilitychange', () => { if (document.hidden && tiles.length > 0) saveProgress(); });

            // Font Awesome: подстраховка, если шрифт не подгрузился
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => setTimeout(applyIconFallbacks, 300));
            }
            setTimeout(applyIconFallbacks, 1500);
        });
    </script>
