<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BeWords</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; /* Черный фон для игры */
            font-family: 'Rubik', sans-serif;
        }

        /* --- 1. ЭКРАН ЗАГРУЗКИ (Стиль Bewords) --- */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #F2EBD9; /* Цвет фона загрузки */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000; /* Самый верхний слой */
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
        }

        .brand-name {
            font-size: 48px;
            font-weight: 900;
            color: #4A3B32;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #D6CBB4;
            animation: pulse 1.5s infinite ease-in-out;
            text-align: center;
        }

        .progress-container {
            width: 200px;
            height: 8px;
            background-color: #D6CBB4;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: #E88D67;
            width: 0%;
            border-radius: 10px;
            animation: fillProgress 3.5s linear forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- 2. ЭКРАН "ПЕРЕВЕРНИТЕ УСТРОЙСТВО" --- */
        #orientation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            z-index: 9000; /* Под загрузкой, но над игрой */
            display: none; /* JS включит это при необходимости */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .rotate-icon {
            width: 60px;
            height: 100px;
            border: 4px solid white;
            border-radius: 10px;
            margin-bottom: 30px;
            animation: rotateDevice 2s infinite ease-in-out;
            position: relative;
        }
        
        .rotate-icon::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
        }

        .message {
            font-size: 24px;
            padding: 0 20px;
            line-height: 1.5;
            text-transform: uppercase;
        }

        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            70% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* --- 3. ИГРА --- */
        .game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        iframe {
            border: none;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Хак для перерисовки */
        .force-repaint {
            width: 100.1% !important; 
        }

    </style>
</head>
<body>

    <!-- СЛОЙ 1: Загрузка -->
    <div id="loader-overlay">
        <div class="brand-name">BeWords<br>Football</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- СЛОЙ 2: Поверните экран -->
    <div id="orientation-overlay">
        <div class="rotate-icon"></div>
        <div class="message">Пожалуйста,<br>переверните экран</div>
    </div>

    <!-- СЛОЙ 3: Игра -->
    <div class="game-container">
        <iframe 
            id="game-frame"
            src="https://vaz63.github.io/g177/class-290/" 
            title="BeWords Football"
            allowfullscreen="true"
            scrolling="no"
            frameborder="0"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-orientation-lock"
        ></iframe>
    </div>

    <script>
        // --- ЛОГИКА ЗАГРУЗКИ ---
        let animationFinished = false;
        let gameLoaded = false;

        const loader = document.getElementById('loader-overlay');
        const progressBar = document.getElementById('progress-bar');
        const gameFrame = document.getElementById('game-frame');
        const orientationOverlay = document.getElementById('orientation-overlay');

        // 1. Проверка ориентации экрана
        function checkOrientation() {
            // Показываем просьбу повернуть только если ширина меньше высоты
            if (window.innerWidth < window.innerHeight) {
                orientationOverlay.style.display = 'flex';
            } else {
                orientationOverlay.style.display = 'none';
            }
        }

        // 2. Проверка готовности (Загрузка + Анимация)
        function checkReady() {
            if (animationFinished && gameLoaded) {
                hideLoader();
            }
        }

        function hideLoader() {
            // Плавно убираем загрузочный экран
            loader.style.opacity = '0';
            
            setTimeout(() => {
                loader.style.visibility = 'hidden';
                loader.style.display = 'none';
                
                // Дергаем iframe чтобы обновилась графика
                gameFrame.classList.add('force-repaint');
                setTimeout(() => {
                    gameFrame.classList.remove('force-repaint');
                }, 100);
            }, 500);
        }

        // --- СОБЫТИЯ ---

        // Анимация прогресс-бара завершена
        progressBar.addEventListener('animationend', () => {
            console.log("Animation done");
            animationFinished = true;
            checkReady();
        });

        // Iframe загрузился
        gameFrame.onload = () => {
            console.log("Game Loaded");
            gameLoaded = true;
            checkReady();
        };

        // Страховочный таймер (если iframe не ответит)
        setTimeout(() => {
            if (!animationFinished || !gameLoaded) {
                console.log("Force load timeout");
                animationFinished = true;
                gameLoaded = true;
                checkReady();
            }
        }, 7000);

        // Слушаем повороты экрана
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', () => {
            setTimeout(checkOrientation, 100);
        });

        // Запускаем проверку ориентации сразу
        checkOrientation();

    </script>
</body>
</html>
