<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58CC02">
<meta name="robots" content="noindex, follow">
<title>404 — BeWords | Страница потерялась</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/nunito@latest/cyrillic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/nunito@latest/cyrillic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/nunito@latest/cyrillic-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/nunito@latest/latin-800-normal.css">

<style>

:root{
  --green:#58CC02;
  --green-2:#89E219;
  --green-dark:#46A302;
  --green-deep:#358F01;
  --ink:#3C3C3C;
  --muted:#777;
  --card:#fff;
  --radius:clamp(22px,6vw,32px);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overflow-x:hidden;
}

body{
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:
    calc(env(safe-area-inset-top) + clamp(20px,5vh,40px))
    clamp(14px,4vw,32px)
    calc(env(safe-area-inset-bottom) + clamp(20px,5vh,40px));
  overflow-x:hidden;
  overflow-y:auto;
  position:relative;
  -webkit-font-smoothing:antialiased;
}

/* ─── изолированный слой декора ─── */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;contain:layout paint style}

.cloud{
  position:absolute;background:rgba(255,255,255,.14);border-radius:100px;
  will-change:transform;animation:drift linear infinite;backface-visibility:hidden;
}
.cloud::before{content:"";position:absolute;left:22%;top:-55%;width:45%;height:150%;background:inherit;border-radius:100px}
.cloud::after{content:"";position:absolute;right:20%;top:-35%;width:32%;height:120%;background:inherit;border-radius:100px}
.c1{width:120px;height:38px;top:18%;left:-160px;animation-duration:34s;animation-delay:-4s}
.c2{width:90px;height:30px;top:58%;left:-130px;animation-duration:46s;animation-delay:-18s}
.c3{width:150px;height:46px;top:78%;left:-200px;animation-duration:60s;animation-delay:-30s}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(100vw + 260px),0,0)}}

.star{
  position:absolute;color:rgba(255,255,255,.55);
  font-size:clamp(14px,3.5vw,20px);
  animation:twinkle 3.4s ease-in-out infinite;will-change:transform,opacity;
}
.s1{top:14%;left:14%}.s2{top:26%;right:16%;animation-delay:1.1s}
.s3{bottom:22%;left:9%;animation-delay:2.2s}.s4{bottom:14%;right:11%;animation-delay:.6s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}

.letter{
  position:absolute;bottom:-12%;font-weight:800;line-height:1;
  color:rgba(255,255,255,.26);
  animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite;
  will-change:transform,opacity;
}
@keyframes rise{
  0%{transform:translate3d(0,0,0) rotate(-8deg);opacity:0}
  10%{opacity:1}88%{opacity:1}
  100%{transform:translate3d(0,-118vh,0) rotate(55deg);opacity:0}
}

/* ─── контент ─── */
.stack{
  position:relative;z-index:1;width:100%;max-width:470px;
  display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3.5vh,28px);
}

.logo{
  display:flex;align-items:center;gap:9px;
  font-size:clamp(22px,6vw,27px);font-weight:800;letter-spacing:.3px;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.14);user-select:none;
}
.logo svg{width:1em;height:1em;display:block;flex:0 0 auto}

.card{
  width:100%;background:var(--card);border-radius:var(--radius);
  padding:clamp(26px,6vw,44px) clamp(18px,5vw,40px) clamp(26px,6vw,38px);
  box-shadow:0 18px 50px rgba(0,0,0,.16),0 3px 0 rgba(0,0,0,.05);
  text-align:center;position:relative;
  animation:slideUp .55s cubic-bezier(.22,.9,.3,1) both;
}
@keyframes slideUp{from{opacity:0;transform:translate3d(0,26px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

.dot{position:absolute;border-radius:50%;background:rgba(88,204,2,.13);animation:pulse 3.4s ease-in-out infinite;pointer-events:none}
.d1{width:52px;height:52px;top:-22px;right:-18px}
.d2{width:30px;height:30px;bottom:-13px;left:-11px;animation-delay:1s}
.d3{width:38px;height:38px;top:52%;left:-19px;animation-delay:2s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.16);opacity:.9}}

/* ══ КОНТЕЙНЕР КАРТИНКИ ══ */
.cat-container{
  width:min(76%,264px);
  margin:0 auto clamp(14px,3vh,24px);
  position:relative;
}

/* ══ САМ 404.webp: никаких поворотов, никаких искажений ══ */
.cat-image{
  display:block;
  width:100%;                 /* тянем по контейнеру, а не жёсткими px */
  height:auto;                /* пропорции файла сохраняются 1:1 */
  max-height:44vh;            /* на коротких экранах не выдавливает кнопку */
  margin:0 auto;
  object-fit:contain;
  background:transparent;
  border:0;
  transform:none !important;  /* защита от «наследованного» вращения */
  animation:none !important;
  transition:none !important;
  backface-visibility:hidden;
  -webkit-user-drag:none;
  user-select:none;
  pointer-events:none;
}

/* SVG-заглушка, если /404.webp не доехал */
.fallback{display:none;width:100%;height:auto}
.cat-container.is-broken .cat-image{display:none}
.cat-container.is-broken .fallback{display:block}

/* микро-анимации заглушки */
.fb-cat{animation:bob 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.fb-tail{animation:wag 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:8% 92%}
@keyframes wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(10deg)}}

h1{
  color:var(--ink);font-size:clamp(21px,5.8vw,28px);font-weight:800;
  line-height:1.25;margin-bottom:.45em;text-wrap:balance;
}
.subtitle{
  color:var(--muted);font-size:clamp(14.5px,4.2vw,18px);line-height:1.55;
  margin-bottom:clamp(22px,4.5vh,32px);text-wrap:pretty;
}
.subtitle br{display:none}
@media (min-width:520px){.subtitle br{display:inline}}

.home-button{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  width:100%;max-width:330px;min-height:54px;
  background:var(--green);color:#fff;padding:15px 28px;
  border:none;border-radius:16px;text-decoration:none;
  font:800 clamp(16px,4.5vw,18px)/1 'Nunito',sans-serif;
  box-shadow:0 4px 0 var(--green-deep);cursor:pointer;
  transition:background .18s ease,transform .12s ease,box-shadow .12s ease;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;will-change:transform;
}
.home-button:hover{background:var(--green-dark);transform:translateY(2px);box-shadow:0 2px 0 var(--green-deep)}
.home-button:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-deep)}
.home-button:focus-visible{outline:3px solid #fff;outline-offset:3px}

.hint{margin-top:clamp(14px,3vh,20px);font-size:clamp(12.5px,3.4vw,14px);color:#9a9a9a}
.hint a{color:var(--green-dark);font-weight:700;text-decoration:none;border-bottom:1px dashed rgba(70,163,2,.5)}
.hint a:hover{border-bottom-style:solid}

@media (max-width:600px){
  .cat-container{width:min(66%,200px)}
}
@media (max-width:380px){
  .d3{display:none}
  .card{padding:24px 16px 26px}
  .cat-container{width:62%}
}
@media (max-height:520px){
  .cat-container{width:min(44%,180px);margin-bottom:12px}
  .subtitle{margin-bottom:18px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .letter{display:none}
}
</style>
<base target="_blank">
</head>

<body>

  </main>

</div>


</body>
</html>
