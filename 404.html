<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7fbf8" />
<title>404 — страница не найдена | BeWords</title>
<meta name="description" content="Такой страницы нет в BeWords. Возвращайтесь к урокам: 8000+ слов, грамматика A1–C2 и игры с котом Бобом." />
<meta name="robots" content="noindex, follow" />

<link rel="icon" type="image/png" sizes="96x96" href="/app-photos/icons/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="32x32" href="/app-photos/icons/favicon-32x32.png">
<link rel="icon" href="/app-photos/icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/app-photos/icons/icon-192.png">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-900-normal.css">

<style>

:root{
  --ink:#18322f;
  --muted:#71827e;
  --green:#58cc02;
  --green-dark:#46a302;
  --green-deep:#358f01;
  --blue:#1cb0f6;
  --paper:#f7fbf8;
  --white:#fff;
}

*,*::before,*::after{box-sizing:border-box}

html{
  height:100%;
  overflow-x:hidden;
  overscroll-behavior-x:none;
  max-width:100%;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  max-width:100%;
  overflow-x:clip;
  overscroll-behavior-x:none;
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:
    calc(env(safe-area-inset-top) + clamp(28px,6vh,56px))
    clamp(18px,5vw,32px)
    calc(env(safe-area-inset-bottom) + clamp(28px,6vh,56px));
}

img,svg{max-width:100%}
h1,p{margin:0}
p,h1{overflow-wrap:break-word;text-wrap:pretty}

/* мягкое световое пятно на фоне — без скроллбаров, слой изолирован */
.glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:layout paint style;
}
.glow::before{
  content:"";position:absolute;left:50%;top:-14vh;translate:-50% 0;
  width:min(880px,140vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(193,245,159,.30),rgba(222,249,221,.10) 60%,transparent 70%);
}

.page{
  position:relative;z-index:1;
  width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:clamp(14px,2.6vh,22px);
  animation:appear .55s cubic-bezier(.22,.9,.3,1) both;
}
@keyframes appear{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}

/* ── логотип (не меню, просто знак бренда) ── */
.brand{
  display:inline-flex;align-items:center;gap:9px;
  font-size:clamp(18px,5vw,21px);font-weight:850;letter-spacing:-1.1px;color:var(--ink);
  text-decoration:none;
}
.brand>span>span{color:#26a7df}
.brand-mark{
  width:34px;height:34px;border-radius:12px;overflow:hidden;flex:0 0 auto;
  display:grid;place-items:center;background:#eaf4ff;
  box-shadow:inset 0 0 0 1px rgba(29,70,79,.08),0 2px 5px rgba(24,60,49,.08);
}
.brand-mark img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}

/* ── арт: ореол + 404.webp ── */
.art{
  position:relative;
  width:min(84%,340px);
  aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;
  margin:clamp(2px,1vh,8px) 0;
}
.halo{
  position:absolute;inset:6%;border-radius:48% 52% 43% 57%/50% 44% 56% 50%;
  background:linear-gradient(145deg,#d9f8c7,#c9f0eb);
  box-shadow:inset 0 -12px 0 rgba(61,151,89,.08);
  animation:blob 9s ease-in-out infinite;
}
.halo::after{
  content:"";position:absolute;inset:16px;border-radius:inherit;
  border:1px dashed rgba(49,145,98,.22);
}
@keyframes blob{
  0%,100%{border-radius:48% 52% 43% 57%/50% 44% 56% 50%}
  50%{border-radius:52% 48% 55% 45%/45% 54% 46% 55%}
}

.spark{
  position:absolute;color:#f5b825;font-size:20px;line-height:0;z-index:3;
  animation:twinkle 2.8s ease-in-out infinite;
}
.spark svg{display:block;width:1em;height:1em;fill:currentColor}
.spark-a{top:6%;right:6%}
.spark-b{bottom:14%;left:2%;font-size:15px;animation-delay:1.1s}
@keyframes twinkle{
  0%,100%{transform:scale(.85) rotate(0deg);opacity:.6}
  50%{transform:scale(1.18) rotate(16deg);opacity:1}
}

/* ══ ГЛАВНОЕ: картинка /404.webp ══
   Анимация внутри файла работает. Снаружи — только лёгкое «дыхание»
   по вертикали. Никакого rotate / transform. */
.cat-404{
  position:relative;z-index:2;
  display:block;
  width:100%;
  height:auto;                 /* пропорции файла сохраняются — ничего не тянется */
  max-height:100%;
  object-fit:contain;
  object-position:center;
  transform:none;              /* защита от «унаследованного» поворота */
  rotate:0deg;                 /* независимое свойство rotate тоже зафиксировано */
  filter:drop-shadow(0 12px 12px rgba(34,58,45,.12));
  will-change:translate;
  -webkit-user-drag:none;
  user-select:none;
}
@keyframes bobfloat{
  0%,100%{translate:0 0}
  50%{translate:0 -9px}
}

/* ── текст ── */
.copy{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,16px)}

.code{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10px;font-weight:850;letter-spacing:1.6px;color:#598373;
}
.code i{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 4px rgba(88,204,2,.13);flex:0 0 auto;
}

h1{
  font-size:clamp(26px,7.6vw,38px);
  font-weight:880;line-height:1.1;letter-spacing:-.045em;color:#17332f;
  text-wrap:balance;max-width:22ch;
}
h1 span{color:#52be10;position:relative;white-space:nowrap}
h1 span::after{
  content:"";position:absolute;left:2px;right:4px;bottom:1px;height:8px;z-index:-1;
  background:#d9f4c8;border-radius:7px;transform:rotate(-1.5deg);
}

.lead{
  font-size:clamp(13.5px,4vw,15px);
  line-height:1.7;font-weight:500;color:#697e79;
  max-width:44ch;
}

/* ── одна кнопка ── */
.button{
  height:55px;padding:0 24px;border:0;border-radius:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  background:var(--green);color:#fff;
  font:850 clamp(13px,3.8vw,14px)/1 Inter,sans-serif;
  text-decoration:none;cursor:pointer;
  box-shadow:0 5px 0 var(--green-dark),0 10px 24px rgba(88,204,2,.18);
  transition:transform .16s,box-shadow .16s,background .2s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  width:min(100%,330px);
}
.button:hover{background:#62db08;transform:translateY(-2px);box-shadow:0 7px 0 var(--green-dark),0 13px 24px rgba(88,204,2,.22)}
.button:active{transform:translateY(3px);box-shadow:none}
.button:focus-visible{outline:3px solid #b6e968;outline-offset:3px}
.button .arrow{font-size:19px;line-height:0}

/* ── узкие и низкие экраны ── */
@media (max-width:380px){
  .art{width:min(80%,270px)}
  .button{height:52px;padding:0 20px}
}
@media (max-height:560px){
  .art{width:min(48%,210px)}
  .glow::before{display:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
@supports not (overflow-x:clip){
  body{overflow-x:hidden}
}
</style>
</head>

<body>

<div class="glow" aria-hidden="true"></div>

<main class="page">

  <a class="brand" href="/" aria-label="BeWords — на главную">
    <span class="brand-mark">
      <img src="/app-photos/icons/apple-touch-icon.png" alt=""
           onerror="this.onerror=null;this.src='/app-photos/error/nophoto.jpg'" />
    </span>
    <span>Be<span>Words</span></span>
  </a>

  <div class="art">
    <div class="halo" aria-hidden="true"></div>

    <!-- анимированный WebP: анимация внутри файла остаётся, снаружи ничего не крутится -->
    <img class="cat-404" src="/404.webp" alt="Кот Боб с табличкой 404"
         decoding="async" fetchpriority="high"
         onerror="this.onerror=null;this.src='/app-photos/error/nophoto.jpg'" />
  </div>

  <div class="copy">
    <div class="code"><i aria-hidden="true"></i> ОШИБКА 404 · СТРАНИЦА НЕ НАЙДЕНА</div>

    <h1>Упс! Кот съел <span>эту страницу!</span></h1>

    <p class="lead">
      Но не волнуйтесь, вы можете продолжить учиться в Bewords
    </p>

    <a class="button" href="/">Вернуться к урокам</a>
  </div>

</main>

<script>
/* Анти-сдвиг: страница не должна «уезжать» вбок на мобильных
   (overflow-x:hidden всё равно оставляет программный scrollLeft). */
(function () {
  'use strict';
  var scroller = document.scrollingElement || document.documentElement;
  if (!scroller) return;

  function reset() {
    try {
      if (scroller.scrollLeft !== 0) scroller.scrollLeft = 0;
      if (document.body && document.body.scrollLeft !== 0) document.body.scrollLeft = 0;
    } catch (e) {}
  }

  var frame = 0;
  function schedule() {
    if (frame) return;
    frame = requestAnimationFrame(function () { frame = 0; reset(); });
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', function () { setTimeout(reset, 60); });
  document.addEventListener('focusin', schedule);
  window.addEventListener('load', reset);
  reset();
  setTimeout(reset, 350);

  console.log('BeWords 404 page loaded');
})();
</script>

</body>
</html>
