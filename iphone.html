<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Заголовок для вкладки браузера (пользователь видит это при чтении инструкции) -->
  <title>Установи BeWords на iPhone!</title>

  <!-- ========================================== -->
  <!-- НАСТРОЙКИ ДЛЯ ЭКРАНА "ДОМОЙ" (PWA ДЛЯ iOS) -->
  <!-- ========================================== -->
  
  <!-- Короткое имя, которое будет под иконкой на рабочем столе -->
  <meta name="apple-mobile-web-app-title" content="BeWords">
  
  <!-- Иконка приложения (iOS берет её отсюда) -->
  <link rel="apple-touch-icon" href="https://bewords.ru/icon-192.png">
  
  <!-- Обязательный тег! Открывает сайт как приложение (без кнопок и строки поиска Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- Цвет статус-бара (где часы и батарея) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- ========================================== -->

  <!-- СКРИПТ ПРОВЕРКИ PWA -->
  <script>
    // Проверяем, открыт ли сайт как приложение с домашнего экрана
    var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    
    // Если да, сразу перенаправляем в основное приложение
    if (isStandalone) {
      localStorage.setItem('pwa_launched', 'true');
      window.location.replace("https://bewords.ru");
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preload" href="https://bewords.ru/icon-192.png" as="image">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
      background:linear-gradient(160deg,#4facfe 0%,#00f2fe 100%);
      min-height:100vh;
      min-height:-webkit-fill-available;
      padding:20px;
      -webkit-font-smoothing:antialiased;
    }

    .container{max-width:480px;margin:0 auto}

    /* ======== HEADER ======== */
    .header{text-align:center;padding:16px 0 24px;animation:headerIn .6s ease}
    @keyframes headerIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}

    .header-logo{
      width:80px;height:80px;
      border-radius:20px;
      box-shadow:0 8px 28px rgba(0,0,0,.2);
      margin-bottom:14px;
    }

    .header h1{
      color:#fff;font-size:1.65em;font-weight:900;
      line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.13);
    }

    .header .sub{
      color:rgba(255,255,255,.85);font-size:.92em;
      font-weight:700;margin-top:5px;
    }

    /* ======== CARD ======== */
    .card{
      background:#fff;border-radius:22px;padding:22px;
      box-shadow:0 16px 50px rgba(0,0,0,.1);
      animation:cardIn .5s .15s ease both;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* ======== BROWSER TABS ======== */
    .section-label{
      font-size:.7em;color:#aaa;font-weight:800;
      text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;
    }

    .btabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}

    .btab{
      display:inline-flex;align-items:center;gap:5px;
      padding:7px 11px;border:2px solid #eaeaea;border-radius:10px;
      background:#fff;cursor:pointer;
      font-family:inherit;font-size:.78em;font-weight:700;color:#999;
      transition:all .15s ease;outline:none;
      -webkit-tap-highlight-color:transparent;
    }
    .btab:hover{border-color:#4facfe;color:#4facfe}
    .btab.active{border-color:#4facfe;background:#f0f7ff;color:#4facfe}

    .btab-icon{width:16px;height:16px;display:flex;flex-shrink:0}
    .btab-icon svg{width:100%;height:100%}

    .badge-auto{
      font-size:.58em;background:#4facfe;color:#fff;
      padding:1px 5px;border-radius:4px;font-weight:800;line-height:1.5;
    }

    /* ======== STEPS ======== */
    .steps{animation:fadeUp .35s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

    .step{
      display:flex;gap:13px;position:relative;padding-bottom:18px;
    }
    .step:last-child{padding-bottom:0}

    /* timeline line */
    .step::after{
      content:'';position:absolute;
      left:16px;top:38px;bottom:0;
      width:2px;background:#e4f0ff;border-radius:1px;
    }
    .step:last-child::after{display:none}

    .snum{
      width:34px;height:34px;min-width:34px;
      background:linear-gradient(135deg,#4facfe,#00d4ff);
      color:#fff;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:.9em;
      position:relative;z-index:1;
      box-shadow:0 3px 10px rgba(79,172,254,.28);
    }

    .sbody{
      flex:1;padding-top:6px;
      font-size:.9em;line-height:1.55;color:#444;font-weight:600;
    }
    .sbody strong{color:#4facfe;font-weight:800}

    /* ======== INLINE ICON BADGE ======== */
    .ic{
      display:inline-flex;align-items:center;justify-content:center;
      width:30px;height:30px;
      background:#f2f7ff;border:1.5px solid #d6e6ff;border-radius:8px;
      vertical-align:middle;margin:0 3px;padding:4px;
    }
    .ic svg{width:100%;height:100%}

    /* ======== DONE BLOCK ======== */
    .done{
      display:flex;align-items:center;gap:14px;
      background:linear-gradient(135deg,#eaf5ff,#d6ecff);
      border:2px solid #4facfe;border-radius:16px;
      padding:16px 18px;margin-top:22px;
    }

    .done-img{
      width:52px;height:52px;min-width:52px;
      border-radius:14px;
      box-shadow:0 4px 14px rgba(79,172,254,.25);
    }

    .done-info h3{
      font-size:1.1em;font-weight:900;color:#4facfe;
      display:flex;align-items:center;gap:6px;
    }
    .done-info h3 svg{width:22px;height:22px;flex-shrink:0}

    .done-info p{
      font-size:.85em;font-weight:700;color:#666;margin-top:3px;
    }
    .done-info p strong{color:#333}

    /* ======== TIP ======== */
    .tip{
      display:flex;align-items:flex-start;gap:10px;
      background:#fffce6;border:1.5px solid #ffe680;border-radius:12px;
      padding:12px 14px;margin-top:14px;
      font-size:.78em;color:#7a6c00;font-weight:600;line-height:1.5;
    }
    .tip-ic{width:20px;height:20px;min-width:20px;flex-shrink:0}
    .tip-ic svg{width:100%;height:100%}

    @media(max-width:380px){
      body{padding:14px}
      .card{padding:16px}
      .header h1{font-size:1.35em}
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer">

    <div class="header">
      <img src="https://bewords.ru/icon-192.png" alt="BeWords" class="header-logo">
      <h1>Установи BeWords<br>на iPhone</h1>
      <p class="sub">за 4 простых шага</p>
    </div>

    <div class="card">
      <p class="section-label">Браузер</p>
      <div class="btabs" id="tabs"></div>
      <div id="content"></div>
    </div>

  </div>

  <script>
    // Скрываем интерфейс инструкции, если скрипт в head не успел отработать
    // и страница уже открылась как PWA
    if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
      document.getElementById('mainContainer').style.display = 'none';
    }

    /* ═══════ SVG inline icons for steps ═══════ */
    const IC = {
      share: '<span class="ic"><svg viewBox="0 0 24 24" fill="none">'
        + '<path d="M7 9H5.5A1.5 1.5 0 004 10.5v9A1.5 1.5 0 005.5 21h13'
        + 'a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0018.5 9H17" '
        + 'stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
        + '<path d="M12 2.5v10" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round"/>'
        + '<path d="M8.5 6L12 2.5 15.5 6" stroke="#007AFF" stroke-width="1.8" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></svg></span>',

      addHome: '<span class="ic"><svg viewBox="0 0 24 24" fill="none">'
        + '<rect x="3" y="3" width="18" height="18" rx="3" stroke="#007AFF" stroke-width="1.8"/>'
        + '<path d="M12 8v8M8 12h8" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round"/>'
        + '</svg></span>',

      dots: '<span class="ic"><svg viewBox="0 0 24 24">'
        + '<circle cx="12" cy="5" r="2" fill="#555"/>'
        + '<circle cx="12" cy="12" r="2" fill="#555"/>'
        + '<circle cx="12" cy="19" r="2" fill="#555"/></svg></span>',
    };

    /* ═══════ Browser tab icons ═══════ */
    const TAB = {
      safari:
        '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#006CFF"/>'
        + '<polygon points="8,2.5 9.2,6.8 8,8 6.8,6.8" fill="#fff" opacity=".9"/>'
        + '<polygon points="8,13.5 6.8,9.2 8,8 9.2,9.2" fill="#FF3B30" opacity=".9"/>'
        + '<circle cx="8" cy="8" r="1" fill="#fff"/></svg>',
      chrome:
        '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#4285F4"/>'
        + '<circle cx="8" cy="8" r="3" fill="#fff"/><circle cx="8" cy="8" r="2" fill="#4285F4"/>'
        + '<path d="M8,1 A7,7 0 0,1 14,5.5L10,5.5A3,3 0 0,0 8,5Z" fill="#EA4335"/>'
        + '<path d="M14,5.5A7,7 0 0,1 10,14.5L8,11A3,3 0 0,0 11,8Z" fill="#FBBC05"/>'
        + '<path d="M10,14.5A7,7 0 0,1 2,5.5L5.5,8A3,3 0 0,0 6,10.5Z" fill="#34A853"/></svg>',
      yandex:
        '<svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3" fill="#FC3F1D"/>'
        + '<text x="8" y="12" font-family="Arial" font-size="10" font-weight="bold" '
        + 'fill="#fff" text-anchor="middle">Я</text></svg>',
      opera:
        '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#FF1B2D"/>'
        + '<ellipse cx="8" cy="8" rx="3.5" ry="5.5" fill="#fff"/>'
        + '<ellipse cx="8" cy="8" rx="2" ry="4.5" fill="#FF1B2D"/></svg>',
    };

    /* ═══════ Instructions data ═══════ */
    const BROWSERS = {
      safari: {
        name: 'Safari',
        steps: [
          'Открой <strong>bewords.ru</strong> в браузере Safari',
          'Нажми «Поделиться» ' + IC.share + ' внизу (или сначала на ' + IC.dots + ' справа внизу, затем «Поделиться»)',
          'Пролистай вниз и нажми ' + IC.addHome + ' «На экран "Домой"»',
          'Нажми <strong>«Добавить»</strong> в правом верхнем углу',
        ],
        tip: 'Safari — лучший способ установить BeWords. Приложение будет работать как полноценное!'
      },
      chrome: {
        name: 'Chrome',
        steps: [
          'Открой <strong>bewords.ru</strong> в Google Chrome',
          'Нажми на кнопку «Поделиться» ' + IC.share + ' вверху справа',
          'Пролистай и нажми ' + IC.addHome + ' «На экран "Домой"»',
          'Нажми <strong>«Добавить»</strong> для подтверждения',
        ],
        tip: 'Для лучшей работы рекомендуем открыть bewords.ru в Safari.'
      },
      yandex: {
        name: 'Яндекс',
        steps: [
          'Открой <strong>bewords.ru</strong> в Яндекс Браузере',
          'Нажми ' + IC.dots + ' (три точки) внизу экрана',
          'Нажми <strong>«Добавить ярлык»</strong> в появившемся меню',
          'Подтверди, нажав <strong>«Добавить»</strong>',
        ],
        tip: 'Для полноценной работы рекомендуем открыть bewords.ru в Safari.'
      },
      opera: {
        name: 'Opera',
        steps: [
          'Открой <strong>bewords.ru</strong> в браузере Opera',
          'Нажми ' + IC.dots + ' (меню) внизу экрана',
          'Выбери <strong>«На главный экран»</strong>',
          'Подтверди, нажав <strong>«Добавить»</strong>',
        ],
        tip: 'Для полноценной работы рекомендуем открыть bewords.ru в Safari.'
      }
    };

    /* ═══════ Auto-detect browser ═══════ */
    function detect() {
      var ua = navigator.userAgent;
      if (/YaBrowser/i.test(ua))                       return 'yandex';
      if (/OPT\/|OPiOS/i.test(ua))                    return 'opera';
      if (/CriOS/i.test(ua))                           return 'chrome';
      if (/Safari/i.test(ua) && !/Chrome/i.test(ua))   return 'safari';
      return 'safari';
    }

    var detected = detect();
    var current  = detected;

    /* ═══════ Render ═══════ */
    function render() {
      var tabsHtml = '';
      for (var k in BROWSERS) {
        var b = BROWSERS[k];
        tabsHtml += '<button class="btab' + (k === current ? ' active' : '') + '" data-b="' + k + '">'
          + '<span class="btab-icon">' + TAB[k] + '</span>'
          + b.name
          + (k === detected ? ' <span class="badge-auto">АВТО</span>' : '')
          + '</button>';
      }
      document.getElementById('tabs').innerHTML = tabsHtml;

      document.querySelectorAll('.btab').forEach(function(btn) {
        btn.addEventListener('click', function() {
          current = this.dataset.b;
          render();
        });
      });

      var data = BROWSERS[current];
      var html = '<div class="steps">';

      data.steps.forEach(function(s, i) {
        html += '<div class="step">'
          + '<div class="snum">' + (i + 1) + '</div>'
          + '<div class="sbody">' + s + '</div>'
          + '</div>';
      });
      html += '</div>';

      html += '<div class="done">'
        + '<img src="https://bewords.ru/icon-192.png" alt="BeWords" class="done-img">'
        + '<div class="done-info"><h3>'
        + '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#4facfe"/>'
        + '<path d="M8 12.5l2.5 3 5.5-6" stroke="#fff" stroke-width="2.2" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + 'Готово!</h3>'
        + '<p>Открой <strong>BeWords</strong> с рабочего стола</p>'
        + '</div></div>';

      html += '<div class="tip">'
        + '<span class="tip-ic"><svg viewBox="0 0 24 24" fill="none">'
        + '<circle cx="12" cy="12" r="10" fill="#FFD93D"/>'
        + '<path d="M12 8h.01M12 12v4" stroke="#7A6C00" stroke-width="2.2" stroke-linecap="round"/>'
        + '</svg></span>'
        + '<span>' + data.tip + '</span></div>';

      document.getElementById('content').innerHTML = html;
    }

    render();
  </script>
</body>
</html>
