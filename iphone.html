<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Установи BeWords на iPhone!</title>

  <meta name="apple-mobile-web-app-title" content="BeWords">
  <link rel="apple-touch-icon" href="https://bewords.ru/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script>
    var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (isStandalone) {
      localStorage.setItem('pwa_launched', 'true');
      window.location.replace("https://bewords.ru");
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preload" href="https://bewords.ru/icon-192.png" as="image">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
      background:linear-gradient(160deg,#4facfe 0%,#00f2fe 100%);
      min-height:100vh;
      min-height:-webkit-fill-available;
      padding:20px;
      -webkit-font-smoothing:antialiased;
    }

    .container{max-width:480px;margin:0 auto}

    /* ======== HEADER ======== */
    .header{text-align:center;padding:16px 0 20px;animation:headerIn .6s ease}
    @keyframes headerIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}

    .header-logo{
      width:84px;height:84px;
      border-radius:22px;
      box-shadow:0 10px 32px rgba(0,0,0,.18);
      margin-bottom:14px;
    }

    .header h1{
      color:#fff;font-size:1.7em;font-weight:900;
      line-height:1.2;text-shadow:0 2px 10px rgba(0,0,0,.12);
    }

    .header .sub{
      color:rgba(255,255,255,.9);font-size:.95em;
      font-weight:700;margin-top:6px;
    }

    /* ======== AUTO-DETECT BANNER ======== */
    .detect-banner{
      background:rgba(255,255,255,.22);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border:1.5px solid rgba(255,255,255,.35);
      border-radius:14px;
      padding:10px 16px;
      margin-bottom:16px;
      text-align:center;
      color:#fff;
      font-size:.82em;
      font-weight:800;
      text-shadow:0 1px 2px rgba(0,0,0,.1);
      animation:bannerIn .5s .3s ease both;
      transition:all .3s ease;
    }
    .detect-banner.hidden{
      opacity:0;transform:translateY(-8px);pointer-events:none;height:0;padding:0;margin:0;border:none;overflow:hidden;
    }
    @keyframes bannerIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

    /* ======== CARD ======== */
    .card{
      background:#fff;border-radius:24px;padding:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.12);
      animation:cardIn .5s .15s ease both;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    .section-label{
      font-size:.68em;color:#b0b0b0;font-weight:800;
      text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;
    }

    /* ======== BROWSER TABS ======== */
    .btabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}

    .btab{
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 13px;border:2px solid #eaeaea;border-radius:12px;
      background:#fff;cursor:pointer;
      font-family:inherit;font-size:.8em;font-weight:800;color:#999;
      transition:all .2s cubic-bezier(.34,1.56,.64,1);
      outline:none;position:relative;
      -webkit-tap-highlight-color:transparent;
    }
    .btab:hover{border-color:#c0e0ff;color:#4facfe;transform:translateY(-1px)}
    .btab.active{
      border-color:#4facfe;
      background:linear-gradient(135deg,#f0f7ff,#e0f0ff);
      color:#4facfe;
      transform:scale(1.05);
      box-shadow:0 4px 16px rgba(79,172,254,.2);
      z-index:1;
    }

    .btab-icon{width:18px;height:18px;display:flex;flex-shrink:0}
    .btab-icon svg{width:100%;height:100%}

    .badge-auto{
      font-size:.6em;background:#4facfe;color:#fff;
      padding:2px 6px;border-radius:5px;font-weight:900;line-height:1.4;
      box-shadow:0 2px 6px rgba(79,172,254,.3);
      animation:pulse 2s infinite;
    }
    @keyframes pulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.08)}
    }

    /* ======== STEPS ======== */
    .steps-wrapper{animation:fadeUp .4s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    .step{
      display:flex;gap:14px;position:relative;padding-bottom:20px;
    }
    .step:last-child{padding-bottom:0}

    .step::after{
      content:'';position:absolute;
      left:17px;top:40px;bottom:2px;
      width:3px;background:linear-gradient(180deg,#4facfe 0%,#e0f0ff 100%);
      border-radius:2px;
    }
    .step:last-child::after{display:none}

    .snum{
      width:36px;height:36px;min-width:36px;
      background:linear-gradient(135deg,#4facfe,#00d4ff);
      color:#fff;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:.95em;
      position:relative;z-index:1;
      box-shadow:0 4px 14px rgba(79,172,254,.35);
    }

    .sbody{
      flex:1;padding-top:7px;
      font-size:.9em;line-height:1.6;color:#444;font-weight:700;
    }
    .sbody strong{color:#2a8af7;font-weight:900}

    /* ======== UI MOCKUP INLINE ======== */
    .ui-mockup{
      display:inline-flex;align-items:center;gap:5px;
      background:#f5f9ff;border:1.5px solid #d0e3ff;
      border-radius:8px;padding:3px 8px;
      font-size:.85em;font-weight:800;color:#007AFF;
      vertical-align:middle;margin:2px 0;
      white-space:nowrap;
    }
    .ui-mockup svg{width:16px;height:16px;flex-shrink:0}

    /* ======== DONE BLOCK ======== */
    .done{
      display:flex;align-items:center;gap:14px;
      background:linear-gradient(135deg,#eaf5ff,#d6ecff);
      border:2px solid #4facfe;border-radius:18px;
      padding:18px 20px;margin-top:24px;
      animation:doneIn .4s .2s ease both;
    }
    @keyframes doneIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

    .done-img{
      width:56px;height:56px;min-width:56px;
      border-radius:16px;
      box-shadow:0 6px 18px rgba(79,172,254,.25);
    }

    .done-info h3{
      font-size:1.15em;font-weight:900;color:#4facfe;
      display:flex;align-items:center;gap:6px;
    }
    .done-info h3 svg{width:24px;height:24px;flex-shrink:0}

    .done-info p{
      font-size:.88em;font-weight:700;color:#555;margin-top:4px;
    }
    .done-info p strong{color:#222}

    /* ======== TIP ======== */
    .tip{
      display:flex;align-items:flex-start;gap:10px;
      background:#fff8db;border:1.5px solid #ffe680;border-radius:14px;
      padding:14px 16px;margin-top:16px;
      font-size:.8em;color:#7a6c00;font-weight:700;line-height:1.55;
    }
    .tip-ic{width:22px;height:22px;min-width:22px;flex-shrink:0;margin-top:1px}
    .tip-ic svg{width:100%;height:100%}

    @media(max-width:380px){
      body{padding:14px}
      .card{padding:16px}
      .header h1{font-size:1.4em}
      .btab{padding:7px 10px;font-size:.75em}
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer">

    <div class="header">
      <img src="https://bewords.ru/icon-192.png" alt="BeWords" class="header-logo">
      <h1>Установи BeWords<br>на iPhone</h1>
      <p class="sub">за 4 простых шага</p>
    </div>

    <div class="detect-banner" id="detectBanner">
      🔍 Мы автоматически выбрали инструкцию для вашего браузера
    </div>

    <div class="card">
      <p class="section-label">Выберите браузер</p>
      <div class="btabs" id="tabs"></div>
      <div id="content"></div>
    </div>

  </div>

  <script>
    if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
      document.getElementById('mainContainer').style.display = 'none';
    }

    /* ═══════ SVG inline icons ═══════ */
    const IC = {
      share: '<span class="ui-mockup"><svg viewBox="0 0 24 24" fill="none">'
        + '<path d="M7 9H5.5A1.5 1.5 0 004 10.5v9A1.5 1.5 0 005.5 21h13'
        + 'a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0018.5 9H17" '
        + 'stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
        + '<path d="M12 2.5v10" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/>'
        + '<path d="M8.5 6L12 2.5 15.5 6" stroke="#007AFF" stroke-width="2" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></svg>Поделиться</span>',

      addHome: '<span class="ui-mockup"><svg viewBox="0 0 24 24" fill="none">'
        + '<rect x="3" y="3" width="18" height="18" rx="3" stroke="#007AFF" stroke-width="2"/>'
        + '<path d="M12 8v8M8 12h8" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/>'
        + '</svg>На экран "Домой"</span>',

      dots: '<span class="ui-mockup" style="color:#555;border-color:#ddd;background:#f8f8f8">'
        + '<svg viewBox="0 0 24 24">'
        + '<circle cx="12" cy="5" r="2.5" fill="#555"/>'
        + '<circle cx="12" cy="12" r="2.5" fill="#555"/>'
        + '<circle cx="12" cy="19" r="2.5" fill="#555"/></svg>⋯</span>',

      add: '<span class="ui-mockup" style="background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32">'
        + '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/></svg>'
        + 'Добавить</span>',

      check: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#4facfe"/>'
        + '<path d="M8 12.5l2.5 3 5.5-6" stroke="#fff" stroke-width="2.5" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    /* ═══════ Browser tab icons ═══════ */
    const TAB = {
      safari:
        '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#006CFF"/>'
        + '<polygon points="8,2.5 9.2,6.8 8,8 6.8,6.8" fill="#fff" opacity=".9"/>'
        + '<polygon points="8,13.5 6.8,9.2 8,8 9.2,9.2" fill="#FF3B30" opacity=".9"/>'
        + '<circle cx="8" cy="8" r="1" fill="#fff"/></svg>',
      chrome:
        '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#4285F4"/>'
        + '<circle cx="8" cy="8" r="3" fill="#fff"/><circle cx="8" cy="8" r="2" fill="#4285F4"/>'
        + '<path d="M8,1 A7,7 0 0,1 14,5.5L10,5.5A3,3 0 0,0 8,5Z" fill="#EA4335"/>'
        + '<path d="M14,5.5A7,7 0 0,1 10,14.5L8,11A3,3 0 0,0 11,8Z" fill="#FBBC05"/>'
        + '<path d="M10,14.5A7,7 0 0,1 2,5.5L5.5,8A3,3 0 0,0 6,10.5Z" fill="#34A853"/></svg>',
      yandex:
        '<svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3" fill="#FC3F1D"/>'
        + '<text x="8" y="12" font-family="Arial" font-size="10" font-weight="bold" '
        + 'fill="#fff" text-anchor="middle">Я</text></svg>',
      opera:
        '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#FF1B2D"/>'
        + '<ellipse cx="8" cy="8" rx="3.5" ry="5.5" fill="#fff"/>'
        + '<ellipse cx="8" cy="8" rx="2" ry="4.5" fill="#FF1B2D"/></svg>',
    };

    /* ═══════ Instructions data ═══════ */
    const BROWSERS = {
      safari: {
        name: 'Safari',
        steps: [
          'Открой <strong>bewords.ru</strong> в браузере Safari',
          'Нажми кнопку ' + IC.share + ' в панели внизу экрана',
          'Пролистай вниз и выбери ' + IC.addHome,
          'Нажми ' + IC.add + ' в правом верхнем углу',
        ],
        tip: 'Safari — лучший способ установить BeWords. Приложение будет работать как полноценное, без адресной строки!'
      },
      chrome: {
        name: 'Chrome',
        steps: [
          'Открой <strong>bewords.ru</strong> в Google Chrome',
          'Нажми кнопку ' + IC.share + ' вверху справа',
          'Пролистай меню и выбери ' + IC.addHome,
          'Нажми ' + IC.add + ' для подтверждения',
        ],
        tip: 'Для полноценной работы (без адресной строки) рекомендуем открыть bewords.ru в Safari.'
      },
      yandex: {
        name: 'Яндекс',
        steps: [
          'Открой <strong>bewords.ru</strong> в Яндекс Браузере',
          'Нажми ' + IC.dots + ' внизу экрана',
          'Выбери <strong>«Добавить ярлык»</strong> в меню',
          'Подтверди, нажав ' + IC.add,
        ],
        tip: 'Яндекс Браузер добавляет сайт на рабочий стол, но для полноценного PWA-режима лучше использовать Safari.'
      },
      opera: {
        name: 'Opera',
        steps: [
          'Открой <strong>bewords.ru</strong> в браузере Opera',
          'Нажми ' + IC.dots + ' (меню) внизу экрана',
          'Выбери <strong>«На главный экран»</strong>',
          'Подтверди, нажав ' + IC.add,
        ],
        tip: 'Для полноценной работы без адресной строки рекомендуем открыть bewords.ru в Safari.'
      }
    };

    /* ═══════ Auto-detect browser ═══════ */
    function detect() {
      var ua = navigator.userAgent;
      if (/YaBrowser/i.test(ua))                       return 'yandex';
      if (/OPT\/|OPiOS/i.test(ua))                    return 'opera';
      if (/CriOS/i.test(ua))                           return 'chrome';
      if (/Safari/i.test(ua) && !/Chrome/i.test(ua))   return 'safari';
      return 'safari';
    }

    var detected = detect();
    var current  = detected;
    var manualSwitch = false;

    /* ═══════ Render ═══════ */
    function render() {
      var tabsHtml = '';
      for (var k in BROWSERS) {
        var b = BROWSERS[k];
        tabsHtml += '<button class="btab' + (k === current ? ' active' : '') + '" data-b="' + k + '">'
          + '<span class="btab-icon">' + TAB[k] + '</span>'
          + b.name
          + (k === detected ? ' <span class="badge-auto">АВТО</span>' : '')
          + '</button>';
      }
      document.getElementById('tabs').innerHTML = tabsHtml;

      document.querySelectorAll('.btab').forEach(function(btn) {
        btn.addEventListener('click', function() {
          current = this.dataset.b;
          if (current !== detected) {
            manualSwitch = true;
            document.getElementById('detectBanner').classList.add('hidden');
          }
          render();
        });
      });

      var data = BROWSERS[current];
      var html = '<div class="steps-wrapper">';

      data.steps.forEach(function(s, i) {
        html += '<div class="step">'
          + '<div class="snum">' + (i + 1) + '</div>'
          + '<div class="sbody">' + s + '</div>'
          + '</div>';
      });
      html += '</div>';

      html += '<div class="done">'
        + '<img src="https://bewords.ru/icon-192.png" alt="BeWords" class="done-img">'
        + '<div class="done-info"><h3>' + IC.check + 'Готово!</h3>'
        + '<p>Найди и открой <strong>BeWords</strong> на рабочем столе iPhone</p>'
        + '</div></div>';

      html += '<div class="tip">'
        + '<span class="tip-ic"><svg viewBox="0 0 24 24" fill="none">'
        + '<circle cx="12" cy="12" r="10" fill="#FFD93D"/>'
        + '<path d="M12 8h.01M12 12v4" stroke="#7A6C00" stroke-width="2.5" stroke-linecap="round"/>'
        + '</svg></span>'
        + '<span>' + data.tip + '</span></div>';

      document.getElementById('content').innerHTML = html;
    }

    render();
  </script>
</body>
</html>
