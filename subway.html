<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewords Game</title>
    
    <!-- Подключаем округлый, "мягкий" шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">

    <style>
        /* Основные настройки страницы */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; /* Черный фон под игрой */
            font-family: 'Rubik', sans-serif;
        }

        /* --- ЗАГРУЗОЧНЫЙ ЭКРАН --- */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Бежевый "игровой" цвет */
            background-color: #F2EBD9; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999; /* Поверх всего */
            transition: opacity 0.5s ease-in-out; /* Плавное исчезновение */
        }

        /* Логотип BEWORDS */
        .brand-name {
            font-size: 48px;
            font-weight: 900;
            color: #4A3B32; /* Темно-коричневый */
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #D6CBB4; /* Легкая тень для объема */
            animation: pulse 1.5s infinite ease-in-out;
        }

        /* Контейнер полоски загрузки */
        .progress-container {
            width: 200px;
            height: 8px;
            background-color: #D6CBB4;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        /* Сама полоска, которая едет */
        .progress-bar {
            height: 100%;
            background-color: #E88D67; /* Акцентный оранжевый/терракотовый */
            width: 0%;
            border-radius: 10px;
            /* Анимация заполнения ровно на 3 секунды */
            animation: fillProgress 3s linear forwards;
        }

        /* Анимация пульсации текста */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Анимация заполнения полоски */
        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- КОНТЕЙНЕР ИГРЫ --- */
        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loader-overlay">
        <div class="brand-name">BEWORDS</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- Игра -->
    <div class="game-container">
        <iframe 
            src="https://i.gamesgo.net/uploads/game/html5/25490/" 
            title="Subway Surfers"
            allowfullscreen="true"
            scrolling="no"
            frameborder="0"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-orientation-lock"
        ></iframe>
    </div>

    <script>
        // Скрипт для управления загрузкой
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-overlay');
            
            // Ждем 3000 миллисекунд (3 секунды)
            setTimeout(function() {
                // Делаем прозрачным
                loader.style.opacity = '0';
                
                // Через полсекунды (когда анимация исчезновения пройдет) удаляем блок,
                // чтобы можно было кликать по игре
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 500);
                
            }, 3000);
        });
    </script>

</body>
</html>
