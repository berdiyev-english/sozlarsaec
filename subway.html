<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Добавлено viewport-fit=cover для корректной работы на iPhone с челкой -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bewords Game</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0b316b; /* Цвет фона как в игре, чтобы не мигало белым */
            font-family: 'Rubik', sans-serif;
        }

        /* --- ЗАГРУЗОЧНЫЙ ЭКРАН --- */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #F2EBD9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-in-out;
        }

        .brand-name {
            font-size: 48px;
            font-weight: 900;
            color: #4A3B32;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #D6CBB4;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .progress-container {
            width: 200px;
            height: 8px;
            background-color: #D6CBB4;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: #E88D67;
            width: 0%;
            border-radius: 10px;
            animation: fillProgress 3.5s linear forwards; /* Чуть увеличили время */
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- КОНТЕЙНЕР ИГРЫ --- */
        .game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        iframe {
            border: none;
            display: block;
            width: 100%;
            height: 100%;
            /* Важно: transition может мешать резкому пересчету размеров в некоторых движках, убрали */
        }

        /* Класс для "встряски" экрана */
        .shake-dimensions {
            width: 101% !important; /* Чуть меняем ширину */
            height: 99% !important; /* Чуть меняем высоту */
        }

    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="brand-name">BEWORDS</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="game-container">
        <!-- 
           Убрали force-landscape из старта. 
           Пусть загружается нормально, а JS потом "дернет" его.
        -->
        <iframe 
            id="game-frame"
            src="https://g.igroutka.ru/games/164/NpBgPruAK8CiHj9D/12/subway_surfers_winter_wonderland/" 
            title="Game"
            allowfullscreen="true"
            scrolling="no"
            frameborder="0"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-orientation-lock"
        ></iframe>
    </div>

    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-overlay');
            const iframe = document.getElementById('game-frame');
            
            // Функция для принудительного пересчета размеров (Reflow)
            function triggerResize() {
                // 1. Добавляем класс, который чуть меняет размер (эмуляция поворота/ресайза)
                iframe.classList.add('shake-dimensions');
                
                // 2. Форсируем браузер применить изменения прямо сейчас
                void iframe.offsetWidth; 
                
                // 3. Через короткую паузу возвращаем всё как было
                setTimeout(() => {
                    iframe.classList.remove('shake-dimensions');
                    // Снова форсируем
                    void iframe.offsetWidth; 
                    iframe.focus();
                }, 100);
            }

            // --- ЛОГИКА ЗАПУСКА ---

            // 1. Ждем 1.5 секунды, пока игра начнет грузить свои ассеты
            setTimeout(function() {
                triggerResize(); // ПЕРВОЕ "Встряхивание", чтобы движок проснулся
            }, 1500);

            // 2. Ждем 3 секунды (конец загрузки)
            setTimeout(function() {
                // ВТОРОЕ "Встряхивание" перед самым показом, на случай если первое не сработало
                triggerResize();

                // Убираем лоадер
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                    iframe.focus(); // Фокус на игру
                }, 500);
            }, 3500);
        });
    </script>

</body>
</html>
