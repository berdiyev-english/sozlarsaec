<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewords Game</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Rubik', sans-serif;
        }

        /* --- ЗАГРУЗОЧНЫЙ ЭКРАН --- */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #F2EBD9; /* Бежевый */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-in-out;
        }

        .brand-name {
            font-size: 48px;
            font-weight: 900;
            color: #4A3B32;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #D6CBB4;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .progress-container {
            width: 200px;
            height: 8px;
            background-color: #D6CBB4;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: #E88D67;
            width: 0%;
            border-radius: 10px;
            /* Анимация ровно 3 секунды */
            animation: fillProgress 3s linear forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- КОНТЕЙНЕР ИГРЫ --- */
        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        iframe {
            border: none;
            display: block;
            transition: all 0.1s ease; /* Мгновенный переход при смене размера */
        }

        /* 
           Класс для принудительного горизонтального режима.
           Делаем ширину огромной, а высоту маленькой.
           Это заставит игру думать, что она в Landscape.
        */
        .force-landscape {
            position: absolute;
            width: 150vw !important;  /* Шире экрана */
            height: 50vh !important;  /* Половина высоты */
            top: 25%;
            left: -25%;
        }

        /* Нормальное состояние */
        .normal-portrait {
            width: 100% !important;
            height: 100% !important;
            position: relative;
            top: 0;
            left: 0;
        }

    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loader-overlay">
        <div class="brand-name">BEWORDS</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- Игра -->
    <div class="game-container">
        <!-- 
            Сразу даем класс force-landscape, чтобы при старте 
            iframe был "сплющенным" (горизонтальным)
        -->
        <iframe 
            id="game-frame"
            class="force-landscape"
            src="https://i.gamesgo.net/uploads/game/html5/25490/" 
            title="Subway Surfers"
            allowfullscreen="true"
            scrolling="no"
            frameborder="0"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-orientation-lock"
        ></iframe>
    </div>

    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-overlay');
            const iframe = document.getElementById('game-frame');
            
            // --- ЭТАП 1: Игра загружается в "сплющенном" (горизонтальном) виде (CSS класс .force-landscape) ---
            // Это происходит автоматически при старте HTML
            
            // --- ЭТАП 2: Через 2 секунды переключаем в нормальный (вертикальный) вид ---
            setTimeout(function() {
                iframe.classList.remove('force-landscape');
                iframe.classList.add('normal-portrait');
                
                // Принудительно сообщаем ифрейму, что он в фокусе, чтобы перерисовка сработала
                iframe.focus();
            }, 2000);

            // --- ЭТАП 3: Через 3 секунды убираем заставку ---
            setTimeout(function() {
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 500);
            }, 3000);
        });
    </script>

</body>
</html>
