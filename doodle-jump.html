<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flying Bob - Летающий кот Боб</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow: hidden;
            touch-action: manipulation;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 50%, #90EE90 95%, #228B22 100%);
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        
        .game-title {
            font-size: 3rem;
            color: #FFD700;
            text-shadow: 3px 3px 0 #8B4513, -1px -1px 0 #8B4513, 1px -1px 0 #8B4513, -1px 1px 0 #8B4513;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .play-btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            background: linear-gradient(to bottom, #4CAF50, #45a049);
            color: white;
            border: 4px solid #2E7D32;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2E7D32;
            transition: all 0.1s;
        }
        
        .play-btn:active {
            box-shadow: 0 2px 0 #2E7D32;
            transform: translateY(4px);
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        
        .final-score {
            font-size: 2rem;
            color: white;
            margin: 20px 0;
        }
        
        .best-score {
            font-size: 1.2rem;
            color: #FFD700;
            margin-bottom: 20px;
        }
        
        .hidden {
            display: none !important;
        }
        
        .bob-preview {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            animation: float 2s ease-in-out infinite;
        }
        
        /* Стили для обложки игры на старте */
        .game-cover {
            width: 280px;
            height: auto;
            max-height: 350px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 25px;
            border: 6px solid #FFFFFF;
            transform: rotate(-3deg);
            transition: transform 0.5s ease;
        }
        
        .game-cover:hover {
            transform: rotate(0deg) scale(1.05);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        
        .level-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            color: #FFD700;
            font-size: 1.2rem;
            margin-bottom: 15px;
            border: 2px solid #FFD700;
        }

        #levelDisplay {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
        }
        
        .instructions {
            color: white;
            font-size: 1rem;
            margin-top: 20px;
            text-align: center;
            opacity: 0.8;
        }

        #pauseBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.1s;
        }

        #pauseBtn:active {
            transform: scale(0.9);
        }

        #pauseScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            z-index: 30;
            backdrop-filter: blur(4px);
        }

        .pause-title {
            font-size: 3rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="score" class="hidden">0</div>
        <div id="levelDisplay" class="hidden">LVL 1</div>
        <button id="pauseBtn" class="hidden">ll</button>
        
        <!-- Pause Screen -->
        <div id="pauseScreen" class="hidden">
            <h2 class="pause-title">ПАУЗА</h2>
            <button class="play-btn" id="resumeBtn">ПРОДОЛЖИТЬ</button>
        </div>
        
        <!-- Start Screen -->
        <div id="startScreen">
            <img src="https://bewords.ru/bird.jpg" alt="Flying Bob Cover" class="game-cover">
            <h1 class="game-title">Flying Bob</h1>
            <div class="level-badge">🏆 Макс. уровень: <span id="startMaxLevel">1</span></div>
            <button class="play-btn" id="startBtn">ИГРАТЬ</button>
            <p class="instructions">Тапай или нажимай пробел,<br>чтобы Боб летел!</p>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden">
            <h1 class="game-title" style="color: #FF6B6B;">Game Over</h1>
            <img src="https://bewords.ru/flying_bob.png" alt="Bob" class="bob-preview" style="animation: none; transform: rotate(180deg);">
            <p class="final-score">Счёт: <span id="finalScore">0</span></p>
            <p class="best-score">🏆 Лучший: <span id="bestScore">0</span></p>
            <p class="best-score" style="font-size: 1rem; color: #DDD;">Уровень: <span id="finalLevel">1</span> (Макс: <span id="bestLevel">1</span>)</p>
            <button class="play-btn" id="restartBtn">ЗАНОВО</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('levelDisplay');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const pauseScreen = document.getElementById('pauseScreen');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const finalScoreSpan = document.getElementById('finalScore');
        const bestScoreSpan = document.getElementById('bestScore');
        const startMaxLevelSpan = document.getElementById('startMaxLevel');
        const finalLevelSpan = document.getElementById('finalLevel');
        const bestLevelSpan = document.getElementById('bestLevel');
        
        let skyGradient;

        // Set canvas size
        function resizeCanvas() {
            const rect = gameContainer.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Pre-calculate gradient for optimization
            skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(0.7, '#B0E0E6');
            skyGradient.addColorStop(1, '#90EE90');
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Game variables
        let gameState = 'start'; // start, playing, gameOver
        let score = 0;
        let level = 1;
        let bestScore = localStorage.getItem('bobBestScore') || 0;
        let maxLevel = localStorage.getItem('bobMaxLevel') || 1;
        
        bestScoreSpan.textContent = bestScore;
        startMaxLevelSpan.textContent = maxLevel;
        
        // Bob (the cat)
        const bobImg = new Image();
        bobImg.src = 'https://bewords.ru/flying_bob.png';
        
        const bob = {
            x: 50, // Чуть сдвинем влево, чтобы было больше времени на реакцию
            y: 0,
            width: 85, // Чуть увеличим (было 80)
            height: 85,
            velocity: 0,
            gravity: 0.35, // Более плавная гравитация
            jump: -6.5, // Менее резкий прыжок
            rotation: 0,
            maxFallSpeed: 10,
            flapRotation: -25,
            targetRotation: 0,
            rotationDelay: 0 // Задержка перед поворотом вниз
        };
        
        // Pipes
        let pipes = [];
        const pipeWidth = 80;
        const pipeGap = 200;
        let pipeSpeed = 3;
        let pipeSpawnTimer = 0;
        const pipeSpawnInterval = 100;
        
        // Clouds for background
        let clouds = [];
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height * 0.5,
                size: 30 + Math.random() * 40,
                speed: 0.5 + Math.random() * 0.5
            });
        }
        
        // Ground
        const groundHeight = 80;
        let groundOffset = 0;
        
        function resetGame() {
            bob.y = canvas.height / 2;
            bob.velocity = 0;
            bob.rotation = 0;
            bob.rotationDelay = 0;
            pipes = [];
            score = 0;
            level = 1;
            pipeSpeed = 3;
            pipeSpawnTimer = 0;
            scoreDisplay.textContent = '0';
            levelDisplay.textContent = 'LVL 1';
        }
        
        function jump() {
            if (gameState === 'playing') {
                bob.velocity = bob.jump;
            }
        }
        
        function togglePause() {
            if (gameState === 'playing') {
                gameState = 'paused';
                pauseScreen.classList.remove('hidden');
                pauseBtn.classList.add('hidden'); // Hide pause button when menu is open
            } else if (gameState === 'paused') {
                gameState = 'playing';
                pauseScreen.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
            }
        }
        
        function startGame() {
            resetGame();
            gameState = 'playing';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            pauseScreen.classList.add('hidden');
            scoreDisplay.classList.remove('hidden');
            levelDisplay.classList.remove('hidden');
            pauseBtn.classList.remove('hidden');
        }
        
        function gameOver() {
            gameState = 'gameOver';
            scoreDisplay.classList.add('hidden');
            levelDisplay.classList.add('hidden');
            pauseBtn.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreSpan.textContent = score;
            finalLevelSpan.textContent = level;
            bestLevelSpan.textContent = maxLevel;
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bobBestScore', bestScore);
            }
            if (level > maxLevel) {
                maxLevel = level;
                localStorage.setItem('bobMaxLevel', maxLevel);
            }
            
            bestScoreSpan.textContent = bestScore;
            startMaxLevelSpan.textContent = maxLevel;
        }
        
        function spawnPipe() {
            const minHeight = 80;
            const maxHeight = canvas.height - groundHeight - pipeGap - minHeight;
            const topHeight = minHeight + Math.random() * maxHeight;
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }
        
        function update() {
            if (gameState !== 'playing') return;
            
            // Physics
            bob.velocity += bob.gravity;
            if (bob.velocity > bob.maxFallSpeed) {
                bob.velocity = bob.maxFallSpeed;
            }
            bob.y += bob.velocity;
            
            // Rotation logic
            if (bob.velocity < 0) {
                bob.rotation = -25;
                bob.rotationDelay = 0;
            } else {
                bob.rotationDelay++;
                if (bob.rotationDelay > 10) {
                    bob.rotation += 2;
                    if (bob.rotation > 90) bob.rotation = 90;
                }
            }
            
            // Check boundaries
            if (bob.y < -bob.height) {
                bob.y = -bob.height;
                bob.velocity = 0;
            }
            
            if (bob.y + bob.height > canvas.height - groundHeight) {
                gameOver();
                return;
            }
            
            // Spawn pipes
            pipeSpawnTimer++;
            if (pipeSpawnTimer >= pipeSpawnInterval) {
                spawnPipe();
                pipeSpawnTimer = 0;
            }
            
            // Update pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;
                
                // Collision Detection
                const hitboxX = bob.x + 15;
                const hitboxY = bob.y + 15;
                const hitboxW = bob.width - 30;
                const hitboxH = bob.height - 30;
                
                if (hitboxX + hitboxW > pipes[i].x && hitboxX < pipes[i].x + pipeWidth) {
                    if (hitboxY < pipes[i].topHeight || hitboxY + hitboxH > pipes[i].bottomY) {
                        gameOver();
                        return;
                    }
                }
                
                // Score
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bob.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                    
                    // Level Logic
                    const newLevel = Math.floor(score / 10) + 1;
                    if (newLevel > level) {
                        level = newLevel;
                        levelDisplay.textContent = 'LVL ' + level;
                        pipeSpeed = 3 + (level - 1) * 0.5;
                    }
                }
                
                // Remove off-screen pipes
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
            
            // Update ground offset
            groundOffset = (groundOffset + pipeSpeed) % 40;
            
            // Update clouds
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.size < 0) {
                    cloud.x = canvas.width + cloud.size;
                    cloud.y = Math.random() * canvas.height * 0.4;
                }
            });
        }
        
        function drawCloud(x, y, size) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x + size * 0.4, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
            ctx.arc(x + size * 0.4, y + size * 0.15, size * 0.35, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawPipe(x, topHeight, bottomY) {
            const gradient = ctx.createLinearGradient(x, 0, x + pipeWidth, 0);
            gradient.addColorStop(0, '#5DBE4A');
            gradient.addColorStop(0.3, '#7ED956');
            gradient.addColorStop(0.7, '#5DBE4A');
            gradient.addColorStop(1, '#4AA83C');
            
            // Top pipe
            ctx.fillStyle = gradient;
            ctx.fillRect(x, 0, pipeWidth, topHeight);
            
            // Top pipe cap
            ctx.fillStyle = '#4AA83C';
            ctx.fillRect(x - 5, topHeight - 30, pipeWidth + 10, 30);
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 2;
            ctx.strokeRect(x - 5, topHeight - 30, pipeWidth + 10, 30);
            
            // Bottom pipe
            ctx.fillStyle = gradient;
            ctx.fillRect(x, bottomY, pipeWidth, canvas.height - bottomY - groundHeight);
            
            // Bottom pipe cap
            ctx.fillStyle = '#4AA83C';
            ctx.fillRect(x - 5, bottomY, pipeWidth + 10, 30);
            ctx.strokeStyle = '#2E7D32';
            ctx.strokeRect(x - 5, bottomY, pipeWidth + 10, 30);
        }
        
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw sky gradient (optimized)
            if (skyGradient) {
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                // Fallback if resize hasn't happened yet (should be rare)
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // Draw clouds
            clouds.forEach(cloud => {
                drawCloud(cloud.x, cloud.y, cloud.size);
            });
            
            // Draw pipes
            pipes.forEach(pipe => {
                drawPipe(pipe.x, pipe.topHeight, pipe.bottomY);
            });
            
            // Draw ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Ground grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 20);
            
            // Ground pattern
            ctx.fillStyle = '#654321';
            for (let i = -groundOffset; i < canvas.width + 40; i += 40) {
                ctx.fillRect(i, canvas.height - groundHeight + 20, 20, 10);
            }
            
            // Draw Bob
            ctx.save();
            ctx.translate(bob.x + bob.width / 2, bob.y + bob.height / 2);
            ctx.rotate(bob.rotation * Math.PI / 180);
            
            if (bobImg.complete) {
                ctx.drawImage(bobImg, -bob.width / 2, -bob.height / 2, bob.width, bob.height);
            } else {
                // Fallback: draw a simple cat
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.ellipse(0, 0, bob.width / 2, bob.height / 2.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-8, -5, 4, 0, Math.PI * 2);
                ctx.arc(8, -5, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent click from propagating to canvas
            togglePause();
        });
        resumeBtn.addEventListener('click', togglePause);
        
        // Touch and click controls
        canvas.addEventListener('click', () => {
            if (gameState === 'playing') jump();
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'playing') jump();
        });
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'start') startGame();
                else if (gameState === 'playing') jump();
                else if (gameState === 'gameOver') startGame();
            }
            if (e.code === 'Escape' || e.code === 'KeyP') {
                if (gameState === 'playing' || gameState === 'paused') {
                    togglePause();
                }
            }
        });
        
        // Initialize
        resetGame();
        gameLoop();
    </script>
</body>
</html>
