<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEWORDS TILE</title>
    
    <!-- Шрифты: Playfair (для меню) и Fredoka (для игры) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Montserrat:wght@500;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* --- НАСТРОЙКИ ИГРЫ (CARTOON) --- */
            --game-bg: linear-gradient(180deg, #4FACFE 0%, #00F2FE 100%);
            --tile-w: 60px;
            --tile-h: 68px; /* Высота с учетом 3D грани */
            
            /* Размеры для дока */
            --dock-scale: 0.85; /* Насколько уменьшается фрукт внизу */
            --dock-height: 100px;
            
            /* --- НАСТРОЙКИ МЕНЮ (PREMIUM) --- */
            --beige-light: #F9F7F2;
            --beige-dark: #E6DED1;
            --gold-accent: #C5A059;
            --text-dark: #3D342B;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background: var(--game-bg); /* Фон игры виден сразу (под меню) */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Fredoka', sans-serif; /* Шрифт по умолчанию для игры */
            overflow: hidden;
            position: relative;
        }

        /* =========================================
           1. PREMIUM WELCOME SCREEN (БЕЖЕВЫЙ)
           ========================================= */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Бежевый градиент */
            background: linear-gradient(to bottom, var(--beige-light) 0%, var(--beige-dark) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease-in-out, transform 0.5s;
        }
        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1);
        }

        /* Рамка */
        .deco-frame {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            pointer-events: none;
        }

        /* Премиум Типографика */
        .premium-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            font-size: 4rem;
            color: var(--text-dark);
            line-height: 0.9;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .premium-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold-accent);
            margin-bottom: 60px;
            font-weight: 500;
        }

        /* Строгая кнопка */
        .btn-premium {
            background: var(--text-dark);
            color: var(--beige-light);
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            padding: 18px 60px;
            border: 1px solid var(--gold-accent);
            border-radius: 2px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(61, 52, 43, 0.15);
        }
        .btn-premium:active { transform: translateY(2px); }


        /* =========================================
           2. CARTOON GAMEPLAY (МУЛЬТЯШНЫЙ)
           ========================================= */
        
        /* Шапка игры */
        .header-row {
            width: 100%; max-width: 420px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px 5px;
            z-index: 10;
        }

        .btn-home {
            background: #fff;
            color: #6c5ce7;
            width: 44px; height: 44px;
            border-radius: 12px;
            font-size: 1.5rem;
            border: none;
            box-shadow: 0 4px 0 #dfe6e9;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
            padding-bottom: 5px;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }

        .game-logo {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem; color: white; font-weight: 700;
            text-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        .ui-bar {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-between;
            padding: 5px 25px;
            color: white; font-weight: 600; font-size: 1.2rem;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Игровое поле */
        #game-board {
            position: relative;
            width: 340px;
            height: 440px;
            margin: 10px auto;
        }

        /* --- 3D ПЛИТКИ (ФРУКТЫ) --- */
        .tile {
            width: var(--tile-w);
            height: var(--tile-h);
            background: linear-gradient(to bottom, #fff, #f1f2f6);
            border-radius: 14px;
            position: absolute;
            display: flex; justify-content: center; align-items: center;
            font-size: 32px;
            cursor: pointer;
            
            /* 3D Cartoon Look */
            border: 2px solid #fff;
            box-shadow: 
                0 6px 0 #a4b0be,  /* "Толщина" плитки */
                0 10px 15px rgba(0,0,0,0.15);
            
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            transform-origin: center center;
        }

        .tile.disabled {
            filter: brightness(0.75) grayscale(0.3);
            cursor: default;
            box-shadow: 0 6px 0 #7f8c8d;
        }

        .tile:active:not(.in-dock):not(.disabled) {
            transform: translateY(6px); /* Эффект нажатия */
            box-shadow: 0 0 0 #a4b0be;
        }

        /* Плитка внутри дока */
        .tile.in-dock {
            /* Убираем огромную тень, чтобы влезла в слот */
            box-shadow: none;
            border: 2px solid rgba(255,255,255,0.8);
            background: rgba(255, 255, 255, 0.95);
            /* Важно! Масштабируем плитку через JS или здесь */
            transform: scale(var(--dock-scale)) !important; 
        }

        /* --- ИСПРАВЛЕННЫЙ ДОК (НИЖНЯЯ ПОДКЛАДКА) --- */
        .dock-container {
            background: rgba(255, 255, 255, 0.9); /* Более плотный белый для мультяшности */
            border-radius: 24px;
            border-bottom: 6px solid #dfe6e9; /* 3D эффект самой панели */
            
            width: 94%;
            max-width: 420px;
            height: var(--dock-height);
            
            display: flex; 
            justify-content: center; 
            align-items: center;
            
            margin-bottom: 20px;
            position: relative; 
            z-index: 5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .dock-slot {
            /* РАЗМЕР СЛОТА */
            /* Мы знаем, что плитка 60px * 0.85 = 51px шириной */
            /* Делаем слот чуть больше плитки */
            width: 54px; 
            height: 62px; 
            margin: 0 2px; /* Отступы между слотами */
            
            border-radius: 12px;
            background: #ced6e0; /* Темно-серый цвет "ямки" */
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.2); /* Внутренняя тень */
            
            flex-shrink: 0; /* Не сжимать слоты */
        }

        /* --- МОДАЛКИ (CARTOON STYLE) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-card {
            background: #fff;
            width: 85%; max-width: 320px;
            padding: 30px; border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 0 rgba(0,0,0,0.1);
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        
        .modal-title { 
            font-size: 2rem; color: #2d3436; margin: 10px 0; font-weight: 700; 
        }
        
        .btn-small {
            background: #0984e3; color: white; padding: 12px 35px;
            border-radius: 50px; font-size: 1.2rem; border: none; cursor: pointer;
            box-shadow: 0 6px 0 #06528f; font-family: 'Fredoka', sans-serif;
            margin-top: 15px; font-weight: 600;
        }
        .btn-small:active { transform: translateY(6px); box-shadow: none; }

        /* Анимации */
        @keyframes popScale { 
            0% { transform: scale(0); } 
            60% { transform: scale(1.1); } 
            100% { transform: scale(1); } 
        }
        @keyframes matchAnim {
            0% { transform: scale(var(--dock-scale)); opacity: 1; background: #ffeaa7; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. PREMIUM BEIGE MENU -->
    <div id="start-screen">
        <div class="deco-frame"></div>
        <div class="premium-title">Bewords<br>Tile</div>
        <div class="premium-subtitle">Collection Edition</div>
        <button class="btn-premium" onclick="startGame()">Начать Игру</button>
    </div>

    <!-- 2. CARTOON GAME UI -->
    <div class="header-row">
        <button class="btn-home" onclick="goHome()" title="В меню">⌂</button>
        <div class="game-logo">Bewords</div>
        <div style="width: 44px;"></div>
    </div>
    
    <div class="ui-bar">
        <div id="level-display">Lv. 1</div>
        <div id="score-display">0</div>
    </div>

    <div id="game-board"></div>

    <!-- Исправленная подкладка -->
    <div class="dock-container" id="dock"></div>

    <!-- 3. POPUPS -->
    <div id="gameModal" class="modal-overlay">
        <div class="modal-card">
            <div style="font-size: 4rem;" id="m-emoji">🎉</div>
            <h2 id="m-title" class="modal-title">You Win!</h2>
            <p id="m-text" style="color: #636e72;">Level Completed</p>
            <button id="m-btn" class="btn-small" onclick="nextLevel()">Next</button>
            <div style="margin-top:15px;">
                <span onclick="goHome()" style="color:#b2bec3; cursor:pointer; font-size:0.9rem; font-weight:600;">Back to Menu</span>
            </div>
        </div>
    </div>

<script>
    // РАЗМЕРЫ ПЛИТКИ (Должны совпадать с CSS)
    const TILE_W = 60; 
    const TILE_H = 68; 
    const DOCK_SIZE = 7;
    const ALL_FRUITS = ['🍓', '🍋', '🍇', '🍉', '🥝', '🍍', '🍒', '🍑', '🥥', '🥑', '🍏', '🍊'];

    let currentLevel = 1;
    let score = 0;
    let tiles = [];
    let dock = [];
    let isLocked = false;

    // Аудио
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // Мультяшные звуки
        if (type === 'click') { // "Bubble"
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'dock') { // "Plop"
            osc.type = 'triangle'; osc.frequency.setValueAtTime(250, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'match') { // "Chime"
            [523, 659, 783].forEach((f,i) => {
                let o = audioCtx.createOscillator(); let g = audioCtx.createGain(); o.type='sine';
                o.frequency.value = f; 
                g.gain.setValueAtTime(0.05, now + i*0.05);
                g.gain.linearRampToValueAtTime(0, now + i*0.05 + 0.3);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(now + i*0.05); o.stop(now + i*0.05 + 0.3);
            });
            return;
        } else if (type === 'win') { // Victory
            [523, 659, 783, 1046].forEach((f, i) => {
                let o = audioCtx.createOscillator(); let g = audioCtx.createGain(); o.type='square'; 
                o.frequency.value = f; 
                g.gain.setValueAtTime(0.05, now + i*0.1);
                g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.2);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(now + i*0.1); o.stop(now + i*0.1 + 0.2);
            });
            return;
        }
        osc.connect(gain); gain.connect(audioCtx.destination);
    }

    // Логика
    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        currentLevel = 1; score = 0; loadLevel();
    }
    function goHome() {
        document.getElementById('gameModal').classList.remove('active');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('game-board').innerHTML = '';
        document.getElementById('dock').innerHTML = '';
        tiles = []; dock = [];
    }
    function nextLevel() {
        document.getElementById('gameModal').classList.remove('active');
        currentLevel++; loadLevel();
    }
    function restartLevel() {
        document.getElementById('gameModal').classList.remove('active');
        score = Math.max(0, score - 100); loadLevel();
    }

    function loadLevel() {
        isLocked = false; dock = []; tiles = [];
        document.getElementById('level-display').innerText = `Lv. ${currentLevel}`;
        document.getElementById('score-display').innerText = `${score}`;
        
        const board = document.getElementById('game-board'); board.innerHTML = '';
        const dockEl = document.getElementById('dock'); dockEl.innerHTML = '';
        
        // Генерируем СЛОТЫ (подкладку)
        for(let i=0; i<DOCK_SIZE; i++) {
            let s = document.createElement('div');
            s.className = 'dock-slot';
            dockEl.appendChild(s);
        }

        let typesCount = Math.min(ALL_FRUITS.length, 3 + Math.floor(currentLevel/2));
        let triplesCount = 6 + (currentLevel * 3);
        let deck = [];
        let levelFruits = ALL_FRUITS.sort(() => 0.5 - Math.random()).slice(0, typesCount);
        for(let i=0; i<triplesCount; i++) { let f = levelFruits[i % typesCount]; deck.push(f, f, f); }
        deck.sort(() => 0.5 - Math.random());

        let id = 0;
        deck.forEach((fruit, index) => {
            const el = document.createElement('div');
            el.className = 'tile';
            el.innerText = fruit;
            el.style.animation = `popScale 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards ${index * 0.03}s`;
            
            let r = Math.floor(Math.random() * 6);
            let c = Math.floor(Math.random() * 5);
            if (index > deck.length * 0.6) { r = 1 + Math.floor(Math.random() * 4); c = 1 + Math.floor(Math.random() * 3); }

            let x = (c * (TILE_W+2)) + 15 + (Math.random()*10 - 5);
            let y = (r * (TILE_H-10)) + 20 + (Math.random()*10 - 5);
            if(x > 280) x = 280; if(y > 380) y = 380;

            el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.zIndex = index;

            const tileObj = { id: id++, el, fruit, x, y, z: index, inDock: false };
            el.onclick = () => clickTile(tileObj);
            board.appendChild(el);
            tiles.push(tileObj);
        });
        updateClickability();
    }

    function updateClickability() {
        tiles.forEach(t => {
            if(t.inDock) return;
            let isCovered = false;
            tiles.forEach(other => {
                if(other === t || other.inDock) return;
                if(other.z > t.z) {
                    if(Math.abs(other.x - t.x) < TILE_W - 10 && Math.abs(other.y - t.y) < TILE_H - 10) isCovered = true;
                }
            });
            if(isCovered) t.el.classList.add('disabled');
            else t.el.classList.remove('disabled');
        });
    }

    function clickTile(t) {
        if(isLocked || t.el.classList.contains('disabled') || t.inDock) return;
        if(dock.length >= DOCK_SIZE) return;

        playSound('click');
        t.inDock = true;
        t.el.style.zIndex = 999; // Поверх всего
        
        let insertIdx = dock.length;
        for(let i=dock.length-1; i>=0; i--) {
            if(dock[i].fruit === t.fruit) { insertIdx = i + 1; break; }
        }
        dock.splice(insertIdx, 0, t);
        
        t.el.classList.add('in-dock');
        playSound('dock');

        renderDock();
        updateClickability();
        setTimeout(checkMatches, 300);
    }

    // --- ЛОГИКА ПОЗИЦИОНИРОВАНИЯ В ДОКЕ ---
    function renderDock() {
        const boardRect = document.getElementById('game-board').getBoundingClientRect();
        const slots = document.querySelectorAll('.dock-slot');
        
        dock.forEach((t, i) => {
            const slotRect = slots[i].getBoundingClientRect();
            
            // Находим центр слота
            const slotCenterX = slotRect.left + (slotRect.width / 2);
            const slotCenterY = slotRect.top + (slotRect.height / 2);

            // Находим позицию для плитки.
            // Важно: Плитка масштабируется transform: scale(0.85).
            // Transform происходит от центра (transform-origin: center).
            // Поэтому мы просто ставим центр плитки в центр слота.
            
            const targetX = slotCenterX - (TILE_W / 2) - boardRect.left;
            const targetY = slotCenterY - (TILE_H / 2) - boardRect.top;
            
            t.el.style.left = targetX + 'px';
            t.el.style.top = targetY + 'px';
        });
    }

    function checkMatches() {
        for(let i=0; i < dock.length - 2; i++) {
            if(dock[i].fruit === dock[i+1].fruit && dock[i].fruit === dock[i+2].fruit) {
                isLocked = true;
                const triplet = [dock[i], dock[i+1], dock[i+2]];
                
                playSound('match'); score += 50;
                document.getElementById('score-display').innerText = `${score}`;

                triplet.forEach(t => t.el.style.animation = "matchAnim 0.4s forwards");

                setTimeout(() => {
                    triplet.forEach(t => t.el.remove());
                    dock.splice(i, 3);
                    renderDock();
                    isLocked = false;
                    if(tiles.filter(t => !t.inDock).length === 0 && dock.length === 0) {
                        playSound('win'); showModal(true);
                    }
                }, 400);
                return;
            }
        }
        if(dock.length === DOCK_SIZE) showModal(false);
    }

    function showModal(isWin) {
        const m = document.getElementById('gameModal');
        document.getElementById('m-emoji').innerText = isWin ? "🎉" : "😢";
        document.getElementById('m-title').innerText = isWin ? "You Win!" : "Oops!";
        document.getElementById('m-text').innerText = isWin ? "Level Completed" : "Dock is full!";
        
        const btn = document.getElementById('m-btn');
        btn.innerText = isWin ? "Next Level" : "Try Again";
        btn.style.background = isWin ? "#00b894" : "#d63031";
        btn.style.boxShadow = isWin ? "0 6px 0 #006266" : "0 6px 0 #c0392b";
        btn.onclick = isWin ? nextLevel : restartLevel;
        
        m.classList.add('active');
    }
</script>
</body>
</html>
