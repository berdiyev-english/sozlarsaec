<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BEWORDS TILE</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Обновленные "мультяшные" цвета */
            --bg-color: #4facfe; /* Ярко-голубой */
            --panel-bg: #ffffff;
            --text-color: #2d3436;
            --btn-primary: #00b894; /* Мятно-зеленый */
            --btn-secondary: #fdcb6e; /* Желток */
            --accent-shadow: #2d3436; /* Темная тень для обводки */
            
            --tile-w: clamp(46px, 12vw, 58px);
            --tile-h: clamp(54px, 14vw, 66px);
            --dock-height: 90px;
            --dock-scale: 0.82;
        }

        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none;
            outline: none; 
        }

        html {
            touch-action: manipulation;
            -ms-touch-action: manipulation;
            overflow: hidden;
            background: #4facfe;
        }

        body {
            margin: 0;
            padding: 0;
            /* Фон игры - оставляем приятный голубой, но плоский */
            background-color: #74b9ff;
            background-image: radial-gradient(#dfe6e9 20%, transparent 20%);
            background-size: 20px 20px;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            touch-action: none;
        }

        /* ========== CARTOON MENU (НОВЫЙ СТИЛЬ) ========== */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Яркий фон с точками */
            background-color: #54a0ff;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.2) 20%, transparent 20%),
                radial-gradient(circle, rgba(255,255,255,0.2) 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease-in-out, transform 0.5s;
        }
        #start-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.1); }

        .deco-frame { display: none; } /* Убрали старую рамку */

        .premium-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: clamp(3.5rem, 12vw, 5rem);
            color: #ffeaa7; /* Желтый текст */
            line-height: 0.9;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
            /* Жирная мультяшная обводка */
            -webkit-text-stroke: 3px var(--accent-shadow); 
            text-shadow: 5px 5px 0px var(--accent-shadow);
            transform: rotate(-3deg);
        }
        
        .premium-subtitle {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 40px;
            font-weight: 600;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            background: #ff7675;
            padding: 5px 15px;
            border-radius: 20px;
            transform: rotate(2deg);
            box-shadow: 3px 3px 0 var(--accent-shadow);
            border: 2px solid var(--accent-shadow);
        }

        .stats-box {
            background: #fff;
            border-radius: 20px;
            padding: 20px 40px;
            margin-bottom: 30px;
            text-align: center;
            border: 4px solid var(--accent-shadow);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 320px;
        }
        .stats-box .label {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            color: #636e72;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .stats-box .value {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
        }
        .stats-row { display: flex; justify-content: space-around; width: 100%; }

        /* Мультяшные кнопки */
        .btn-premium {
            background: #00b894; /* Зеленый */
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 15px 40px;
            border: 4px solid var(--accent-shadow);
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 6px 6px 0px var(--accent-shadow); /* Жесткая тень */
            transition: all 0.1s;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        .btn-premium:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px var(--accent-shadow);
        }

        .btn-secondary {
            background: #fab1a0; /* Персиковый */
            color: var(--accent-shadow);
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 30px;
            border: 3px solid var(--accent-shadow);
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 5px 5px 0px var(--accent-shadow);
            width: 70%;
            max-width: 250px;
            margin-top: 5px;
        }
        .btn-secondary:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--accent-shadow);
        }

        /* ========== GAME UI ========== */
        .header-row {
            width: 100%; 
            max-width: 450px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 10px 15px 0;
            z-index: 10;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .btn-icon {
            background: #fff;
            color: #333;
            width: 42px; height: 42px;
            border-radius: 10px;
            font-size: 1.3rem;
            border: 2px solid #333;
            box-shadow: 3px 3px 0 #333;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
            touch-action: manipulation;
        }
        .btn-icon:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #333; }

        .game-logo {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem; 
            color: #fff; 
            font-weight: 700;
            -webkit-text-stroke: 1.5px #333;
            text-shadow: 3px 3px 0 #333;
        }

        .ui-bar {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-between;
            padding: 5px 20px;
            color: #333; font-weight: 700; font-size: 1.1rem;
            z-index: 10;
        }
        #score-display, #level-display {
            background: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            border: 2px solid #333;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        /* ========== GAME BOARD ========== */
        #game-board {
            position: relative;
            width: 95%;
            max-width: 360px;
            flex-grow: 1;
            margin: 8px auto;
            touch-action: none;
        }

        .tile {
            width: var(--tile-w);
            height: var(--tile-h);
            background: #fff;
            border-radius: 12px;
            position: absolute;
            display: flex; justify-content: center; align-items: center;
            font-size: clamp(22px, 7vw, 30px);
            cursor: pointer;
            border: 3px solid #333;
            box-shadow: 3px 3px 0 #999;
            transition: left 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        top 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        transform 0.15s ease,
                        opacity 0.2s ease;
            z-index: 10;
            transform-origin: center center;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        .tile.disabled {
            filter: brightness(0.8) grayscale(0.2);
            cursor: default;
        }

        .tile:not(.disabled):not(.in-dock):active {
            transform: scale(0.92);
            box-shadow: 1px 1px 0 #999;
        }

        .tile.in-dock {
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            border: 2px solid #333;
            background: #fff;
            transform: rotate(0deg) scale(var(--dock-scale)) !important;
        }

        /* ========== DOCK ========== */
        .dock-container {
            background: #fff;
            border-radius: 20px;
            border: 3px solid #333;
            border-bottom: 6px solid #333;
            width: 96%;
            max-width: 400px;
            height: var(--dock-height);
            display: flex; justify-content: center; align-items: center;
            gap: 3px;
            margin-bottom: max(12px, env(safe-area-inset-bottom));
            position: relative; 
            z-index: 5;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 0 8px;
        }

        .dock-slot {
            width: calc(var(--tile-w) * var(--dock-scale)); 
            height: calc(var(--tile-h) * var(--dock-scale)); 
            border-radius: 10px;
            background: #dfe6e9;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        /* ========================================
           🎉 MODALS (CARTOON STYLE)
           ======================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0);
            display: flex; justify-content: center; align-items: center;
            z-index: 300; opacity: 0; pointer-events: none; 
            transition: all 0.5s; overflow: hidden;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); }

        .confetti-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .confetti {
            position: absolute; width: 12px; height: 12px; top: -20px;
            animation: confetti-fall 3s linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        .rays {
            position: absolute; width: 300%; height: 300%;
            background: conic-gradient(
                from 0deg, transparent 0deg, rgba(255, 255, 255, 0.2) 10deg, transparent 20deg, transparent 30deg, rgba(255, 255, 255, 0.2) 40deg, transparent 50deg, transparent 60deg, rgba(255, 255, 255, 0.2) 70deg, transparent 80deg, transparent 90deg
            );
            animation: rotate-rays 20s linear infinite;
            opacity: 0; transition: opacity 1s;
        }
        .modal-overlay.active.win .rays { opacity: 1; }
        @keyframes rotate-rays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .modal-card {
            background: #fff;
            width: 90%; max-width: 340px; padding: 0;
            border-radius: 25px; text-align: center;
            /* Жирная рамка для модалки */
            border: 4px solid #333;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
            transform: scale(0) rotate(-10deg);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: visible;
        }
        .modal-overlay.active .modal-card { transform: scale(1) rotate(0deg); }

        .trophy-container { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); z-index: 10; }
        .trophy {
            font-size: 5rem;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.2));
            animation: trophy-bounce 0.6s ease-out 0.3s both;
        }
        @keyframes trophy-bounce {
            0% { transform: scale(0) rotate(-20deg); }
            50% { transform: scale(1.3) rotate(5deg); }
            70% { transform: scale(0.9) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .stars-container {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 5;
        }
        .star { font-size: 2.5rem; opacity: 0; transform: scale(0) rotate(-180deg); filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.2)); }
        .star:nth-child(1) { animation: star-pop 0.5s ease-out 0.6s forwards; }
        .star:nth-child(2) { animation: star-pop 0.5s ease-out 0.8s forwards; font-size: 3rem; margin-top: -15px; }
        .star:nth-child(3) { animation: star-pop 0.5s ease-out 1s forwards; }
        @keyframes star-pop {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.4) rotate(20deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .modal-content { padding: 60px 30px 30px; }

        .ribbon {
            background: #fdcb6e;
            color: #333; font-family: 'Fredoka', sans-serif; font-weight: 800;
            font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase;
            padding: 10px 40px; position: relative; margin: 0 -30px 20px;
            border-top: 3px solid #333; border-bottom: 3px solid #333;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .win-title {
            font-family: 'Fredoka', sans-serif; font-size: 2.8rem; font-weight: 800;
            color: #00b894;
            -webkit-text-stroke: 2px #333;
            text-shadow: 3px 3px 0 #333;
            margin: 10px 0; animation: title-pulse 2s ease-in-out infinite;
        }
        @keyframes title-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        .level-complete { font-family: 'Fredoka', sans-serif; font-size: 1.1rem; color: #636e72; margin-bottom: 20px; font-weight: 600; }
        .level-complete span { color: #2d3436; font-weight: 800; font-size: 1.4rem; }

        .stats-row-modal {
            display: flex; justify-content: center; gap: 20px; margin: 25px 0; padding: 15px;
            background: #f1f2f6; border-radius: 15px; border: 2px solid #b2bec3;
        }
        .stat-item { text-align: center; }
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 1.8rem; font-weight: 800; color: #333; display: block; }
        .stat-value.animated { animation: count-up 0.5s ease-out forwards; }
        .stat-label { font-size: 0.7rem; color: #636e72; text-transform: uppercase; margin-top: 5px; font-weight: 700; }

        .btn-next-level {
            background: #0984e3;
            color: white; font-family: 'Fredoka', sans-serif; font-size: 1.2rem; font-weight: 700;
            padding: 18px 40px; border: 3px solid #333; border-radius: 15px; cursor: pointer; text-transform: uppercase; 
            box-shadow: 5px 5px 0 #333;
            transition: all 0.1s; position: relative; overflow: hidden; width: 100%; margin-top: 10px;
        }
        .btn-next-level:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #333; }
        .btn-next-level .arrow { display: inline-block; margin-left: 10px; animation: arrow-bounce 1s ease-in-out infinite; }

        .modal-link {
            color: #b2bec3; cursor: pointer; font-size: 0.9rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 20px; display: inline-block; transition: color 0.2s;
        }
        .modal-link:active { color: #636e72; }

        .lose-emoji { font-size: 4rem; animation: shake-emoji 0.5s ease-in-out; display: block; margin-bottom: 10px; filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.2)); }
        .lose-title { font-family: 'Fredoka', sans-serif; font-size: 2.2rem; color: #d63031; margin: 10px 0; -webkit-text-stroke: 1.5px #333; text-shadow: 2px 2px 0 #333; font-weight: 800; }
        .btn-retry {
            background: #d63031;
            color: white; font-family: 'Fredoka', sans-serif; font-size: 1.2rem; font-weight: 700;
            padding: 18px 40px; border: 3px solid #333; border-radius: 15px; cursor: pointer; text-transform: uppercase;
            box-shadow: 5px 5px 0 #333;
            width: 100%; margin-top: 20px;
        }
        .btn-retry:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #333; }

        @keyframes popScale { 0% { transform: scale(0) rotate(0deg); } 100% { transform: scale(1) rotate(var(--rot, 0deg)); } }
        @keyframes matchAnim { 0% { transform: scale(var(--dock-scale)); opacity: 1; background: #ffeaa7; } 50% { transform: scale(1.1); } 100% { transform: scale(0); opacity: 0; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s ease; }

        .save-indicator {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem;
            opacity: 0; transition: opacity 0.3s; z-index: 500; pointer-events: none; border: 2px solid #fff;
        }
        .save-indicator.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="save-indicator" id="saveIndicator">💾 Сохранено</div>

    <!-- CARTOON MENU -->
    <div id="start-screen">
        <!-- Рамку убрали, добавили мультяшный стиль -->
        <div class="premium-title">BEWORDS<br>TILE</div>
        <div class="premium-subtitle">Fruit Puzzle</div>
        
        <div class="stats-box">
            <div class="stats-row">
                <div>
                    <div class="label">Уровень</div>
                    <div class="value" id="menu-level">1</div>
                </div>
                <div>
                    <div class="label">Рекорд</div>
                    <div class="value" id="menu-best">0</div>
                </div>
            </div>
        </div>
        
        <button class="btn-premium" id="btn-continue">ПРОДОЛЖИТЬ</button>
        <button class="btn-secondary" id="btn-new-game">Новая игра</button>
    </div>

    <!-- GAME UI -->
    <div class="header-row">
        <button class="btn-icon" id="btn-home">⌂</button>
        <div class="game-logo">BEWORDS</div>
        <button class="btn-icon" id="btn-restart">↺</button>
    </div>

    <div class="ui-bar">
        <div id="level-display">Lv. 1</div>
        <div id="score-display">0</div>
    </div>

    <div id="game-board"></div>

    <div class="dock-container" id="dock"></div>

    <!-- MODAL -->
    <div id="gameModal" class="modal-overlay">
        <div class="confetti-container" id="confettiContainer"></div>
        <div class="rays"></div>
        
        <div class="modal-card">
            <!-- WIN -->
            <div id="win-content" style="display: none;">
                <div class="trophy-container"><div class="trophy">🏆</div></div>
                <div class="stars-container">
                    <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
                </div>
                
                <div class="modal-content">
                    <div class="ribbon">УРОВЕНЬ ПРОЙДЕН</div>
                    <div class="win-title">ПОБЕДА!</div>
                    <div class="level-complete">Уровень <span id="completed-level">1</span></div>
                    
                    <div class="stats-row-modal">
                        <div class="stat-item">
                            <span class="stat-value" id="modal-score">0</span>
                            <div class="stat-label">Очки</div>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="modal-best">0</span>
                            <div class="stat-label">Рекорд</div>
                        </div>
                    </div>
                    
                    <button class="btn-next-level" id="btn-next">
                        УРОВЕНЬ <span id="next-level-num">2</span>
                        <span class="arrow">→</span>
                    </button>
                    <div class="modal-link" id="m-menu-win">В Меню</div>
                </div>
            </div>
            
            <!-- LOSE -->
            <div id="lose-content" style="display: none;">
                <div class="modal-content" style="padding-top: 30px;">
                    <span class="lose-emoji">😢</span>
                    <div class="lose-title">Не вышло...</div>
                    <p style="color: #636e72; margin: 15px 0; font-weight: 600;">Док переполнен!</p>
                    <button class="btn-retry" id="btn-retry">🔄 Ещё раз</button>
                    <div class="modal-link" id="m-menu-lose">В Меню</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DOCK_SIZE = 7;
        const ALL_FRUITS = ['🍓', '🍋', '🍇', '🍉', '🥝', '🍍', '🍒', '🍑', '🥥', '🥑', '🍏', '🍊'];
        const STORAGE_KEY = 'bewords_tile_save_v3';
        const MIN_TILE_DISTANCE = 20;
        const COLLISION_W = 45;
        const COLLISION_H = 50;
        
        // === ЛИМИТ ПЛИТОК: 60 (20 троек) ===
        const MAX_TILES = 60; 
        const MAX_TRIPLES = MAX_TILES / 3; 

        // ============ STATE ============
        let currentLevel = 1;
        let score = 0;
        let bestScore = 0;
        let tiles = [];
        let dock = [];
        let isLocked = false;
        let audioCtx = null;

        // ============ AUDIO ============
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                g.gain.setValueAtTime(0.08, now);
                g.gain.linearRampToValueAtTime(0, now + 0.08);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'dock') {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                g.gain.setValueAtTime(0.08, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'match') {
                [523, 659, 783].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.04, now + i*0.05);
                    g.gain.linearRampToValueAtTime(0, now + i*0.05 + 0.25);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(now + i*0.05); o.stop(now + i*0.05 + 0.25);
                });
            } else if (type === 'win') {
                const notes = [523, 659, 783, 1046, 783, 1046];
                notes.forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = i < 4 ? 'square' : 'sine';
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.06, now + i*0.12);
                    g.gain.linearRampToValueAtTime(0, now + i*0.12 + 0.3);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(now + i*0.12); o.stop(now + i*0.12 + 0.3);
                });
            } else if (type === 'error') {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(150, now);
                g.gain.setValueAtTime(0.06, now);
                g.gain.linearRampToValueAtTime(0, now + 0.15);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(now); o.stop(now + 0.15);
            }
        }

        // ============ PARTICLES ============
        function createConfetti() {
            const c = document.getElementById('confettiContainer');
            c.innerHTML = '';
            const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1'];
            const shapes = ['■', '●', '▲', '★'];
            for (let i=0; i<50; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.textContent = shapes[Math.floor(Math.random()*shapes.length)];
                el.style.left = Math.random()*100+'%';
                el.style.color = colors[Math.floor(Math.random()*colors.length)];
                el.style.fontSize = (Math.random()*15+10)+'px';
                el.style.animationDelay = Math.random()*2+'s';
                el.style.animationDuration = (Math.random()*2+2)+'s';
                c.appendChild(el);
            }
        }

        // ============ SAVING ============
        function saveProgress() {
            try {
                const data = {
                    level: currentLevel,
                    score: score,
                    bestScore: Math.max(score, bestScore),
                    timestamp: Date.now()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                
                const ind = document.getElementById('saveIndicator');
                ind.classList.add('show');
                setTimeout(() => ind.classList.remove('show'), 1500);
            } catch(e) { console.log('Save failed', e); }
        }

        function loadProgress() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    currentLevel = data.level || 1;
                    score = data.score || 0;
                    bestScore = data.bestScore || 0;
                    return true;
                }
            } catch(e) {}
            return false;
        }

        function updateMenuStats() {
            loadProgress();
            document.getElementById('menu-level').textContent = currentLevel;
            document.getElementById('menu-best').textContent = bestScore;
        }

        // ============ GAME LOGIC ============
        function showStartScreen() {
            updateMenuStats();
            document.getElementById('start-screen').classList.remove('hidden');
            closeModal();
            document.getElementById('game-board').innerHTML = '';
            document.getElementById('dock').innerHTML = '';
            tiles = []; dock = [];
        }

        function startGame(isNew) {
            initAudio();
            if (isNew) {
                currentLevel = 1;
                score = 0;
                saveProgress();
            } else {
                loadProgress();
            }
            document.getElementById('start-screen').classList.add('hidden');
            loadLevel();
        }

        function goHome() {
            saveProgress();
            showStartScreen();
        }

        function nextLevel() {
            closeModal();
            loadLevel();
        }

        function restartLevel() {
            closeModal();
            score = Math.max(0, score - 50); 
            saveProgress();
            loadLevel();
        }

        function closeModal() {
            document.getElementById('gameModal').classList.remove('active', 'win', 'lose');
            document.getElementById('confettiContainer').innerHTML = '';
        }

        function loadLevel() {
            isLocked = false;
            dock = [];
            tiles = [];
            
            document.getElementById('level-display').textContent = `Lv. ${currentLevel}`;
            document.getElementById('score-display').textContent = score;
            
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            
            const dockEl = document.getElementById('dock');
            dockEl.innerHTML = '';
            for(let i=0; i<DOCK_SIZE; i++) {
                const d = document.createElement('div');
                d.className = 'dock-slot';
                dockEl.appendChild(d);
            }
            
            const typesCount = Math.min(ALL_FRUITS.length, 3 + Math.floor(currentLevel/2));
            
            let calculatedTriples = 5 + (currentLevel * 2); 
            const triplesCount = Math.min(calculatedTriples, MAX_TRIPLES);
            
            let deck = [];
            const lvlFruits = [...ALL_FRUITS].sort(()=>0.5-Math.random()).slice(0, typesCount);
            
            for(let i=0; i<triplesCount; i++) {
                const f = lvlFruits[i % typesCount];
                deck.push(f,f,f);
            }
            deck.sort(()=>0.5-Math.random());
            
            const rect = board.getBoundingClientRect();
            const maxX = rect.width - 60;
            const maxY = rect.height - 70;
            const placed = [];
            
            let id = 0;
            deck.forEach((fruit, idx) => {
                const el = document.createElement('div');
                el.className = 'tile';
                el.textContent = fruit;
                
                let x, y, attempts=0;
                do {
                    let r = Math.floor(Math.random()*6);
                    let c = Math.floor(Math.random()*5);
                    if (idx > deck.length*0.5) {
                        r = 1 + Math.floor(Math.random()*4);
                        c = 1 + Math.floor(Math.random()*3);
                    }
                    x = (c*55) + (Math.random()*20-10) + 10;
                    y = (r*60) + (Math.random()*20-10) + 20;
                    x = Math.max(5, Math.min(x, maxX));
                    y = Math.max(5, Math.min(y, maxY));
                    attempts++;
                } while(isTooClose(x,y,placed) && attempts<100);
                
                placed.push({x,y});
                
                const rot = (Math.random()*10)-5;
                el.style.setProperty('--rot', `${rot}deg`);
                el.style.transform = `rotate(${rot}deg)`;
                el.style.left = x+'px';
                el.style.top = y+'px';
                el.style.zIndex = idx;
                el.style.animation = `popScale 0.35s backwards ${idx*0.015}s`;
                
                const tObj = { id: id++, el, fruit, x, y, z: idx, inDock: false };
                
                const action = (e) => { e.preventDefault(); clickTile(tObj); };
                el.addEventListener('click', action);
                el.addEventListener('touchstart', action, {passive:false});
                
                board.appendChild(el);
                tiles.push(tObj);
            });
            
            updateClickability();
        }

        function isTooClose(x, y, arr) {
            for(let p of arr) {
                if (Math.abs(p.x-x) < MIN_TILE_DISTANCE && Math.abs(p.y-y) < MIN_TILE_DISTANCE) return true;
            }
            return false;
        }

        function updateClickability() {
            tiles.forEach(t => {
                if(t.inDock) return;
                let covered = false;
                tiles.forEach(o => {
                    if(o===t || o.inDock) return;
                    if(o.z > t.z) {
                        if (Math.abs(o.x - t.x) < COLLISION_W && Math.abs(o.y - t.y) < COLLISION_H) covered = true;
                    }
                });
                if(covered) t.el.classList.add('disabled');
                else t.el.classList.remove('disabled');
            });
        }

        function clickTile(t) {
            if(isLocked || t.el.classList.contains('disabled') || t.inDock) return;
            
            if(dock.length >= DOCK_SIZE) {
                playSound('error');
                t.el.classList.add('shake');
                setTimeout(()=>t.el.classList.remove('shake'),300);
                return;
            }
            
            isLocked = true;
            playSound('click');
            t.inDock = true;
            t.el.classList.add('in-dock');
            
            let insIdx = dock.length;
            for(let i=dock.length-1; i>=0; i--) {
                if(dock[i].fruit === t.fruit) { insIdx = i+1; break; }
            }
            dock.splice(insIdx, 0, t);
            playSound('dock');
            
            requestAnimationFrame(() => {
                renderDock();
                updateClickability();
                setTimeout(() => {
                    isLocked = false;
                    checkMatches();
                }, 250);
            });
        }

        function renderDock() {
            const bRect = document.getElementById('game-board').getBoundingClientRect();
            const slots = document.querySelectorAll('.dock-slot');
            
            dock.forEach((t, i) => {
                if(i >= slots.length) return;
                const sRect = slots[i].getBoundingClientRect();
                const tx = (sRect.left + sRect.width/2) - bRect.left - t.el.offsetWidth/2;
                const ty = (sRect.top + sRect.height/2) - bRect.top - t.el.offsetHeight/2;
                
                t.el.style.left = `${tx}px`;
                t.el.style.top = `${ty}px`;
                t.el.style.zIndex = 1000 + i;
            });
        }

        function checkMatches() {
            for(let i=0; i<dock.length-2; i++) {
                if(dock[i].fruit === dock[i+1].fruit && dock[i].fruit === dock[i+2].fruit) {
                    isLocked = true;
                    const triplet = [dock[i], dock[i+1], dock[i+2]];
                    playSound('match');
                    score += 50;
                    bestScore = Math.max(score, bestScore);
                    document.getElementById('score-display').textContent = score;
                    
                    triplet.forEach(t => t.el.style.animation = 'matchAnim 0.35s forwards');
                    
                    setTimeout(() => {
                        triplet.forEach(t => t.el.remove());
                        dock.splice(i, 3);
                        renderDock();
                        isLocked = false;
                        
                        const rem = tiles.filter(t => !t.inDock).length;
                        if(rem === 0 && dock.length === 0) {
                            playSound('win');
                            currentLevel++;
                            saveProgress();
                            showWinModal(currentLevel - 1);
                        } else {
                            setTimeout(checkMatches, 100);
                        }
                    }, 350);
                    return;
                }
            }
            if(dock.length === DOCK_SIZE) {
                playSound('error');
                showLoseModal();
            }
        }

        function showWinModal(completedLvl) {
            const m = document.getElementById('gameModal');
            document.getElementById('win-content').style.display = 'block';
            document.getElementById('lose-content').style.display = 'none';
            
            document.getElementById('completed-level').textContent = completedLvl;
            document.getElementById('next-level-num').textContent = currentLevel;
            document.getElementById('modal-score').textContent = score;
            document.getElementById('modal-best').textContent = bestScore;
            
            createConfetti();
            m.classList.add('active', 'win');
            setTimeout(() => {
                document.getElementById('modal-score').classList.add('animated');
                document.getElementById('modal-best').classList.add('animated');
            }, 800);
        }

        function showLoseModal() {
            const m = document.getElementById('gameModal');
            document.getElementById('win-content').style.display = 'none';
            document.getElementById('lose-content').style.display = 'block';
            m.classList.add('active', 'lose');
        }

        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-continue').addEventListener('click', () => startGame(false));
            document.getElementById('btn-new-game').addEventListener('click', () => startGame(true));
            document.getElementById('btn-home').addEventListener('click', goHome);
            document.getElementById('btn-restart').addEventListener('click', restartLevel);
            document.getElementById('btn-next').addEventListener('click', nextLevel);
            document.getElementById('btn-retry').addEventListener('click', restartLevel);
            document.getElementById('m-menu-win').addEventListener('click', goHome);
            document.getElementById('m-menu-lose').addEventListener('click', goHome);
            
            updateMenuStats();
            
            document.addEventListener('touchmove', (e) => {
                if(e.touches.length > 1) e.preventDefault();
            }, {passive:false});
            
            window.addEventListener('resize', () => {
                if(dock.length>0) setTimeout(renderDock, 100);
            });
            
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && tiles.length > 0) saveProgress();
            });
        });
    </script>
</body>
</html>
